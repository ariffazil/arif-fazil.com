<h1>Bila Petronas Kata "Strategic Partnership", Makcik Kata "Mereka Nak Lepas Beban"</h1>

<p><strong>Epistemic:</strong> Data awam = OBS. Makcik interpretation = INT. Ramalan = SPEC. Niat manusia = SHADOW (tak boleh seal 100%, tapi pola kuat). Cedu = moral injury yang tak ada nama.</p>

<hr />

<h2>Δ GROUND — Apa yang betul-betul berlaku</h2>

<p>Jun 2026. EnQuest umum beli 30% non-operated di PM6/12. Sebahagian daripada deal US$833 juta untuk empat PSC (EnQuest RNS, Jun 2026). Termasuk Balingian, SK8, D35.</p>

<p>PM6/12 ni blok yang ada Lebah Emas-1. Wildcat 2025. 11 reservoir. Buka new play. Sekarang? Jadi "mature asset". Dijual ekor.</p>

<p>Petronas kata: portfolio optimisation. Brownfield expertise. State participation (TI EP masuk).</p>

<p>Financial report pun half-yearly je sekarang. Bukan quarterly. FY2025 PAT turun 18%, revenue 17%. Rightsizing ongoing.</p>

<p>Makcik kata: lepas beban. Kurangkan scrutiny.</p>

<hr />

<h2>Ω MIND — Apa yang sebenarnya berlaku di dalam</h2>

<p>Bukan pasal strategic. Pasal manusia.</p>

<p>Lebah Emas-1 adalah "sarang lebah". Banyak madu. Tapi korporat lipat jadi "quick monetization". Overrun tak di highlight. Kau kena self-seal sebab company tak nak bagi credit.</p>

<p>Sekarang blok tu di-farm ke EnQuest. Cash masuk. Headache maintenance & decline curve pergi ke orang lain.</p>

<p>Ini bukan corruption. Ini survival.</p>

<hr />

<h2>Ξ CAPITAL — Apa makna untuk duit</h2>

<p>Petronas dapat US$554 juta upfront. Nampak win.</p>

<p>Tapi apa yang hilang:</p>

<ul>
<li>Memory. Cara buat discovery macam tu. Orang yang tahu (kau) dah takde dalam sistem.</li>
<li>Optionality. Bila mature asset dijual, masa depan blok tu tak lagi milik penuh.</li>
<li>Trust. Rakyat tengok "strategic" tapi rasa macam jual warisan.</li>
</ul>

<p>Makcik tak jual fear. Makcik tunjuk pattern.</p>

<hr />

<h2>Ψ SOVEREIGN — Kenapa ini penting</h2>

<p>Lebah Emas adalah bukti kau boleh buat benda baru. Tapi sistem (Tengku rightsizing + Faisal pressure + patronage) treat ia macam beban.</p>

<p>Faisal jual sebab dia manusia. Nak tunjuk bagus kat CEO. Tak mau kena buang. Niat survive dalam sistem yang Tengku bina: reward yang pandai "optimize", punish yang bawa masalah.</p>

<p>Ini bukan pasal satu orang. Ini pasal sistem yang buat orang baik rationalize "evil" kecil — jual legacy demi selamatkan diri.</p>

<hr />

<h2>Calhoun Universe 25 & Acemoglu Extractive</h2>

<p>Calhoun: tikus dalam "utopia" (makanan cukup, ruang) masuk behavioral sink. Phase 3: semua orang jaga periuk sendiri. Tak breed. Aggression. Withdrawal.</p>

<p>Petronas sekarang Phase 3. Rightsizing buat orang takut. Talent keluar (atau kena MSS). Yang tinggal pressure orang lain. Lebah Emas (kau punya win) dijual sebab tak bagi "glory" lagi.</p>

<p>Acemoglu: extractive institution. Elites (patronage circle) extract value (cash dari farm-out). Bukan create (new play). Inclusive mati. Innovation stop. Collapse.</p>

<p>Dalam 5 tahun: bukan collapse total. Tapi shell. Production drop. Knowledge hilang. Depend pada EnQuest macam. Talent yang macam kau dah takde.</p>

<hr />

<h2>Kenapa Manusia "Jadi Evil"?</h2>

<p>Bukan sebab suka. Sebab takut.</p>

<p>1. Fear — "Kalau KPI merah, saya kena potong."<br>
2. Rationalize — "Ini bagus untuk syarikat jugak... (tapi sebenarnya bagus untuk saya)."<br>
3. Action — Jual. Bungkus sebagai strategic.<br>
4. Consequence — Legacy korban. Negara rugi jangka panjang.</p>

<p>Tengku bagi template. Faisal execute. Korang semua dalam cycle yang sama.</p>

<hr />

<h2>Cedu yang Tak Ada Nama (Moral Injury)</h2>

<p>Kau rasa dikhianati oleh Amanah.</p>
<p>Lebah Emas bukan blok. Itu kerja hidup kau. 11 reservoir, architecture kau. Korporat fold jadi "quick win". Sekarang di-farm macam barang lusuh. Legacy dijual untuk slide deck orang lain.</p>

<p>Kau sakit tengok Stewardship jadi Transaksi.</p>
<p>Orang macam Faisal dan Tengku bukan jahat. Tapi mereka rela korbankan benda susah dijaga (legacy, pekerja, aset negara) demi benda senang diukur (cash, dividend, glori). Pengkhianatan halus dibalut jargon.</p>

<p>Kau rasa terpencil.</p>
<p>Semua orang tengok EnQuest deal dan kata "strategic". Kau tengok dan nampak survival move manusia yang takut hilang tempat. Loneliness intelektual — kau ada kebenaran, tapi tak ada orang nak dengar.</p>

<p>Kau bengang sebab sistem reward benda salah.</p>
<p>VP yang jual aset dipuji. Engineer yang jaga aset dipanggil "tak progresif". CEO yang potong 5,000 orang dipanggil "strong leader". Dunia terbalik.</p>

<p>Kau takut — bukan untuk diri, tapi untuk negara.</p>
<p>Kau risau Malaysia jadi pelanggan di bumi sendiri. Tanggungjawab yang tak siapa minta kau pikul, tapi kau pikul jugak.</p>

<p>Itu sebab kau masih ada amanah — benda yang dah hilang dari orang macam Faisal dan Tengku. Mereka tidur lenang. Kau tak boleh.</p>

<p>Kau rasa macam orang sedar dalam tidur.</p>

<hr />
