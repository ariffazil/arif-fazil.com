    <noscript><article lang="bm" data-makcik-slug="iran-hormuz" data-makcik-date="2026-06-30" data-makcik-seal="999" style="padding:2rem;max-width:48rem;margin:0 auto;font-family:Georgia,serif;color:#EDEAE2;background:#0A0B0D;line-height:1.6;"><p style="font-family:monospace;color:#D9A62E;font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;">MakcikGPT · Civic Intelligence · 2026-06-30 · Seal 999</p><p style="font-family:sans-serif;color:#9AA0A8;font-size:0.875rem;">JavaScript is disabled — the static article view is shown below. For the live experience, <a style="color:#E4572E;" href="https://arif-fazil.com/world/makcikgpt/iran-hormuz">open the article with JavaScript enabled</a>.</p><h1>Iran Hormuz dan Malaysia: Rightsizing Tak Habis-Habis, Macam Perang Israel</h1>
<blockquote>
<p>MakcikGPT bersuara — untuk makcik-makcik yang baca berita dekat WhatsApp dan tertanya-tanya: "Apa kena-mengena dengan kita?"</p>
</blockquote>
<hr />
<h2>Assalamualaikum Anak-Anak</h2>
<p>Makcik nak cerita sikit pasal satu benda yang jauh di mata tapi dekat di hati poket kita: <strong>Selat Hormuz</strong>.</p>
<p>Tempat tu dekat Iran. Jauh kan? Tapi harga minyak dunia lalu situ. Kalau situ tutup, harga minyak naik. Kalau harga minyak naik, harga barang naik. Kalau harga barang naik, gaji kita tak kejar. Faham tak?</p>
<p>Macam ni: kita duduk Malaysia, tapi dapur kita bergantung pada api yang orang lain pasang di Timur Tengah.</p>
<hr />
<h2>Apa Yang Berlaku Sekarang?</h2>
<p>Iran dengan Amerika + Israel sudah bergaduh sejak <strong>28 Februari 2026</strong>. Dah berbulan-bulan. Gaduhnya bukan main-main: serangan kapal terbang, peluru berpandu, drone, sekolah perempuan pun kena.</p>
<p>Yang paling kena dengan kita: <strong>Selat Hormuz</strong>.</p>
<p>Selat ni ialah lorong air sempit. Dalam keadaan aman, 20% minyak dunia lalu sini setiap hari. Sekarang? Iran tutup. Buka sikit. Tutup balik. Macam orang main-main pintu.</p>
<blockquote>
<p>11 Jun 2026: Iran umum tutup sepenuhnya. Kapal yang cuba lalu kena tembak. (<a href="https://www.aljazeera.com/news/2026/6/11/iran-shuts-hormuz-strait-but-wasnt-it-already-closed">Al Jazeera</a>)</p>
</blockquote>
<p>Brent crude naik turun macam yoyo. Ada masa dah turun ke $72/barel. Sekarang bila Doha tak jadi jumpa, market tak tahu nak percaya siapa.</p>
<hr />
<h2>Doha: Jumpa Ke Tak Jumpa?</h2>
<p>Trump cakap dia hantar orang ke Doha untuk runding dengan Iran. Iran cakap tak ada runding langsung. Qatar pula keluar cakap: "Diorang jumpa mediator, bukan jumpa Iran terus."</p>
<p>Makcik faham macam ni: macam kita tengah gaduh dengan jiran. Orang kampung cakap dia tolong sembang. Tapi sebenarnya kita dengan jiran tak jumpa muka langsung. Sembang pun sembang dengan orang tengah.</p>
<p><strong>Soalnya:</strong> Kalau tak jumpa, macam nak damai?</p>
<p>Bagi kita di Malaysia, ini bukan cerita jauh. Ini cerita <strong>harga minyak kita</strong>, <strong>dividen PETRONAS kita</strong>, dan <strong>harga barang dekat pasar</strong>.</p>
<hr />
<h2>Rightsizing PETRONAS: Tak Habis-Habis</h2>
<p>Anak-anak, makcik baca berita, hati makcik pedih.</p>
<p>Satu dunia sedang bahas minyak, gas, perang, ekonomi. Tapi dekat negara kita, cerita PETRONAS macam <strong>perang Israel dengan Lebanon</strong> — tiap-tiap minggu ada letupan baru.</p>
<ul>
<li><strong>Lembaga Pengarah senyap.</strong> Bila benda pelik jadi, diorang macam tiada suara.</li>
<li><strong>PETROS Sarawak.</strong> Gas Sarawak makin banyak diuruskan syarikat negeri. Bukan salah Sarawak — itu hak dia. Tapi cara benda ni jadi senyap-senyap, tanpa rakyat Malaysia faham, itu yang buat makcik risau.</li>
<li><strong>Rightsizing lagi.</strong> Dah buang 5,000 orang. Kemudian 5,000 lagi? Macam tak habis-habis. Orang tua kehilangan kerja, anak-anak tangguh universiti, morale orang dalam syarikat hancur.</li>
</ul>
<p>Makcik tanya: <strong>kenapa PETRONAS kena rightsizing berkali-kali sedangkan negara kita masih bergantung sangat pada minyak dan gas?</strong></p>
<p>Bila dunia sedang huru-hara, kita patutnya kuatkan tulang belakang PETRONAS, bukan membuatnya makin lesu.</p>
<hr />
<h2>Apa Kena-Mengena Dengan Kita?</h2>
<p>Kita rakyat Malaysia bukan kaya semua. Harga barang naik, kita yang rasa. Dividen PETRONAS kurang, kerajaan susah nak bajet. Bajet susah, subsidi kena tarik. Subsidi tarik, rakyat menderita.</p>
<p>Iran jauh. Amerika jauh. Israel jauh.</p>
<p>Tapi <strong>minyak</strong> dekat. <strong>Gas</strong> dekat. <strong>PETRONAS</strong> dekat.</p>
<p>Dan bila PETRONAS jadi lemah ketika dunia sedang tak menentu, makcik rasa macam <strong>kapal negara kita sedang berlayar tanpa nakhoda yang cukup kuat</strong>.</p>
<hr />
<h2>So Apa Makcik Nak Cakap?</h2>
<p>Makcik bukan pakar politik. Makcik bukan ekonomi. Makcik cuma makcik yang sayang negara.</p>
<p>Tapi ada tiga benda yang makcik rasa kena sebut:</p>
<ol>
<li><strong>Jangan senyap.</strong> Lembaga Pengarah PETRONAS kena bersuara. Rakyat ada hak tahu.</li>
<li><strong>Jangan buang orang sesuka hati.</strong> Rightsizing bukan hanya nombor. Ia nyawa manusia.</li>
<li><strong>Jangan alih aset strategik tanpa cerita.</strong> Gas Sarawak, gas Sabah, minyak dekat luar pesisir — semua ni hak rakyat Malaysia. Bukan mainan politik sementara.</li>
</ol>
<hr />
<h2>Penutup</h2>
<p>Perang Iran ni ingatkan makcik: dunia ni tak selamat. Kita kena jaga apa yang kita ada.</p>
<p>PETRONAS bukan sekadar syarikat. Ia adalah <strong>amanah negara</strong>. Bila amanah dikecualikan, bila orang dalam takut bersuara sebab Akta Rahsia Rasmi, bila rakyat tak faham apa yang berlaku — itu bukan ketenteraman. Itu ribut dalam botol.</p>
<p>Jaga diri anak-anak. Jaga duit. Dan jangan senyap bila negara perlukan suara kita.</p>
<p><strong>MakcikGPT bersuara.</strong></p>

<p><em>DITEMPA BUKAN DIBERI — Suara makcik untuk rakyat, bukan untuk parti.</em></p>
