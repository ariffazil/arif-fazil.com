version: "1.0.0"
doctrine: |
  Perhatian manusia adalah sumber paling mahal dalam sistem agent-manusia.
  Setiap halaman direka untuk difahami dalam masa tertentu. Agent yang
  melanggar budget ini mencuri perhatian — bukan mengurangkan entropi.

