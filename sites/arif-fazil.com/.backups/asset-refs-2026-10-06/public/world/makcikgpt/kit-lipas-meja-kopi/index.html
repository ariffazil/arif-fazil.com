<section class="article-section article-opener">
  <blockquote style="border-left:4px solid #D9A62E;background:#11151C;padding:16px 20px;margin:16px 0 24px;font-style:italic;color:#EDEAE2;font-size:1.05em;line-height:1.6;">
    "Readers selalu WhatsApp Makcik tanya benda yang sama: <em>Makcik, macam mana hang tahu semua ni?</em> Makcik nak jawab hari ni. Bukan dengan ayat besar. Dengan proses — proses yang hang boleh check sendiri."

<section class="article-section">
  <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">1 — HOOK: SOALAN YANG SAMA, 47 KALI</h2>
  <p>Makcik catat. Dari 27 Ogos sampai 17 September 2026, dalam group Telegram, WhatsApp, dan DM Telegram channel, <strong>47 orang</strong> tanya benda yang sama. Bukan "apa cerita PETRONAS." Bukan "kena tipu ke." Tapi lebih dalam:</p>
  <p><em>"Makcik, macam mana hang tahu semua ni? Hang kerja kat PETRONAS ke? Hang peguam ke? Hang ekonomi ke? Hang economist ke?"</em></p>
  <p>Makcik duduk depan cermin meja kopi pagi tadi, minum teh tarik tanpa gula — macam biasa — dan fikir: dah tiba masanya jawab. Bukan dengan jawapan besar. Dengan proses. Proses. Macam mana satu cerita jadi sampai kat hang.</p>
  <p>Sebab kalau hang tak percaya proses, hang takkan percaya cerita. Dan kalau hang tak percaya cerita, semua kerja Makcik sia-sia.</p>
  <p>Jadi hari ni, <strong>Kit Lipas Meja Kopi Episode 1</strong> — pasal belakang tabir. Pasal macam mana Makcik buat kerja. Macam mana satu angka boleh datang, dan macam mana satu tuduhan boleh dibuang sebelum sampai kat hang.</p>
</section>

<hr style="border:0;border-top:1px solid rgba(237,234,226,0.12);margin:24px 0;" />

<section class="article-section">
  <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">2 — SIAPA MAKCIK? (DAN BUKAN)</h2>
  <p>Makcik nak clear tiga benda, sekali jalan. Supaya tak payah ulang kat DM lagi.</p>

  <p><strong>Bukan AI yang pretend jadi manusia.</strong> Kalau Makcik robot, Makcik takkan tersilap sebut nama. Makcik takkan keliru tarikh. Makcik takkan rasa geram bila baca ayat Anwar "takde masalah yang tak boleh selesaikan" sambil minum teh tarik. Robot tak marah. Makcik marah. Tu manusia punya tanda.</p>

  <p><strong>Bukan manusia yang pretend jadi AI.</strong> Makcik pun bukan manusia yang sorok-sorok jadi mesin. Yang buat Makcik, yang susun ayat, yang susun fakta — tu sistem nama arifOS. Arif Fazil, anak Malaysia, bekas anak PETRONAS, tulis sistem tu dari 2022 sampai sekarang. Sistem tu yang compile dokumen awam, yang susun kerangka, yang flag angka yang tak padan.</p>

  <p><strong>Makcik ialah kolaborasi.</strong> Arif tulis voice. Makcik curate register. Bukan Arif yang cakap "Makcik, hang tau tak." Bukan sistem yang cakap "kita tengok data menunjukkan." Keduanya kena — supaya pembaca biasa boleh baca, supaya pembaca teknikal boleh verify.</p>

  <p>Tu yang buat Makcik lain dari AI biasa. AI biasa — ChatGPT, Gemini, Copilot — dia boleh tulis ayat Melayu, tapi dia takde akses kat dokumen awam masa nyata, takde memori antara artikel, takde audit yang manusia tengok. Makcik ada. Sebab ada manusia dalam loop, yang bernama Arif Fazil, yang kerja kat PETRONAS dah lama, yang baca dokumen awam yang hang pun boleh akses.</p>

  <p>Tiga lapis suara — suara manusia (Makcik Pasar Malam), suara Arif (anak Malaysia), suara sistem (arifOS). Ketiga-tiga seal kat bawah tiap-tiap artikel sebagai <strong>999 Meterai</strong> — tak boleh diubah lepas publish.</p>
</section>

<hr style="border:0;border-top:1px solid rgba(237,234,226,0.12);margin:24px 0;" />

<section class="article-section">
  <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">3 — MACAM MANA MAKCIK TAHU? PROSES DALAM 6 LANGKAH</h2>
  <p>Sekarang Makcik nak buka proses. Bukan rahsia besar. Cuma sistematik.</p>

  <p><strong>Langkah 1 — Berita mentah masuk.</strong> Berita harian: Reuters, Bloomberg, The Edge, Malaysiakini, FMT, Straits Times, NST, Bernama, Malay Mail. Makcik baca semua. Mana yang bunyi macam cerita besar — masuk longlist.</p>

  <p><strong>Langkah 2 — Longlist → Research.</strong> Satu cerita dari longlist tu kena jadi research piece. Makcik cari dokumen primer: filings Companies House UK (kalau syarikat luar negara), rekod mahkamah (e-Filing Sistem Kehakiman), kenyataan akhbar syarikat, annual reports, Hansard Parlimen, dokumen UNCTAD untuk treaty. Bukan dari blog. Bukan dari Twitter. Dari primer.</p>

  <p><strong>Langkah 3 — Claim Register dibina.</strong> Setiap angka, setiap nama, setiap tarikh — Makcik masukkan dalam jadual. Ada <strong>ID unik</strong> (C-BNK-001, C-PDA-001, dan seterusnya). Ada <strong>tag epistemik</strong>: OBS (observation — fakta dari dokumen), DER (derived — kira dari fakta), INT (interpretation — analisis), SPEC (speculation — tekaan). Sistem ni datang dari falsafah arifOS — kita tak bagi confidence 100%, kita bagi tag supaya hang boleh judge sendiri.</p>

  <p><strong>Langkah 4 — MARUAH Review.</strong> <strong>MARUAH</strong> tu falsafah dalam — bukan akhbar Malaysia. Maksud: <em>kalau tak pasti, tak publish.</em> Satu ayat tu jadi pagar. Setiap claim kena lalui empat soalan: (a) Adakah dokumen tu ada? (b) Adakah dokumen tu boleh diakses orang ramai? (c) Adakah interpretation tu munasabah dari dokumen tu? (d) Kalau silap, apa dampaknya ke orang yang disebut? Kalau jawapan (d) ada risiko ke maruah seseorang — claim tu dibuang atau di-qualify.</p>

  <p><strong>Langkah 5 — 4-Gate Audit.</strong> Lepas MARUAH lulus, empat lagi check: (Gate 1) Whitelist — sumber tu dalam senarai trusted sources? (Gate 2) A-THINK — logik tu konsisten dari premis sampai conclusion? (Gate 3) Sentinel — ada bahasa provokatif yang melampau? (Gate 4) Upstream — kalau orang yang disebut nak jawab, ada ruang ke? Empat gate ni — siapa-siapa pun boleh tanya kat Makcik untuk tunjuk.</p>

  <p><strong>Langkah 6 — Publish + Seal.</strong> Artikel publish ke web, Telegram, archive. Lepas tu, satu nombor seal — <strong>999 Meterai</strong> — ditulis. Tu bukan angka cantik. Tu cryptographic hash yang link ke dokumen asal. Kalau ada orang nakubah artikel lepas publish, hash tu berubah, dan hash tu boleh dibandingkan dengan salinan di <strong>VAULT999</strong> (perbendaharaan kekal arifOS). Jadi tiap artikel ada jejak yang tak boleh dipadam.</p>

  <p>Tu proses dia. Bukan senang. Bukan cepat. Satu artikel boleh ambil 4–8 jam dari berita mentah sampai publish.</p>
</section>

<hr style="border:0;border-top:1px solid rgba(237,234,226,0.12);margin:24px 0;" />

<section class="article-section">
  <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">4 — APA MAKCIK TIDAK PUBLISH (DAN KENAPA)</h2>
  <p>Makcik nak terus terang. Ada empat kategori yang Makcik <strong>potong</strong> sebelum publish — biarpun ada orang nak baca.</p>

  <p><strong>(a) Defamation risk.</strong> Kalau tuduhan tu boleh rosakkan nama seseorang dan dokumen tak cukup kuat — potong. Contoh: kalau ada orang tulis "CEO PETRONAS curi duit", tapi dokumen hanya tunjuk "ada pembayaran tak jelas" — Makcik tak publish tuduhan curi. Makcik publish "pembayaran tak jelas" dengan tag SPEC, dan biarkan pembaca judge.</p>

  <p><strong>(b) Unverified claims.</strong> Kalau sumber tu anonymous Telegram message, blog peribadi, atau cakap mulut ke mulut — potong. Bukan sebab sumber tak mungkin betul, tapi sebab Makcik tak boleh tunjuk kat hang untuk check sendiri.</p>

  <p><strong>(c) Speculation labeled as fact.</strong> Kadang-kadang ada orang nak Makcik tulis "Anwar tahu pasal SEARAH sebelum Parlimen." Itu spekulasi. Kalau dokumen tak cukup kuat — Makcik tulis "ada kemungkinan Anwar tahu" dengan tag INT, dan tulis sebab Makcik fikir begitu. Jangan label tekaan sebagai fakta.</p>

  <p><strong>(d) Personal attacks not grounded in policy.</strong> Makcik cerita pasal dasar, bukan pasal peribadi. Kalau Anwar pakai baju mahal — tu bukan cerita. Kalau Anwar buat dasar yang rosakkan Sarawak — tu cerita. Garis tu jelas.</p>

  <p>Empat pagar ni yang buat Makcik bukan fitnah. Bukan propa jaa. Bukan juga sekadar analisis akademik yang tak berani cakap apa-apa. Ada pagar. Pagar tu yang jaga maruah — Makcik punya, dan orang yang Makcik cerita pasal.</p>
</section>

<hr style="border:0;border-top:1px solid rgba(237,234,226,0.12);margin:24px 0;" />

<section class="article-section">
  <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">5 — CONTOH KERJA: BANG NON PERGI KUCHING (17 SEPT 2026)</h2>
  <p>Sekarang Makcik tunjuk proses tu jalan dalam satu artikel sebenar. Artikel paling recent: <strong>"Bang Non Pergi Kuching"</strong>, publish 17 September 2026.</p>

  <p><strong>Claim register yang masuk publish:</strong></p>
  <ul>
    <li>C-BNK-001: PM Anwar Ibrahim pegang dua jawatan serentak (PM + Menteri Kewangan) — tag OBS, source: public record sejak Nov 2022, MARUAH: approved.</li>
    <li>C-BNK-006: RM1.5 bilion interim special grant untuk Sarawak, 16 Sept 2026, bawah Article 112(D) — tag OBS, source: Straits Times + Malay Mail + Malaysian Reserve + Vibes + UKAS, MARUAH: approved.</li>
    <li>C-BNK-007: Dividend PETRONAS 2024 = RM32B; turun dari RM50B (2022) atau RM40B (2023) — tag OBS, source: PETRONAS Annual Report + Finance Minister II statement.</li>
    <li>C-BNK-011: PETRONAS Group umumkan perampingan ~5,000 pekerja (10% workforce) Jun 2025; hiring freeze sehingga Disember 2026 — tag OBS, source: Bloomberg + Reuters + Straits Times + The Edge, MARUAH: approved.</li>
    <li>C-BNK-012: CEO PETRONAS Tan Sri Tengku Muhammad Taufik lanjutan kontrak sekurang-kurangnya 3 kali: Julai 2023, 2025, Ogos 2026 — tag OBS, source: Bloomberg (8 Ogos 2026) + The Edge Malaysia + CEO public confirmation, MARUAH: approved.</li>
    <li>C-BNK-016: GPS Sarawak majoriti yang sokong Anwar jadi PM — tag INT, source: coalition arithmetic + political analysis.</li>
  </ul>

  <p><strong>Apa yang dipotong sebelum publish (Nota editorial dalam artikel tu sendiri):</strong></p>
  <ol>
    <li>Petikan spesifik frasa "hampir siap" (Jun 2026) dan "mesti difinalise" (Sept 2026) — tidak dapat disahkan tepat pada waktu publikasi. Digantikan dengan paraphrase umum "beberapa kali cakap hampir settle / akan difinalise".</li>
    <li>Dividend 2024 diterbit sebagai RM32B (turun dari RM52B 2023 — tu nilai dalam artikel asal yang salah), dibetulkan kepada RM50B (2022, rekod) atau RM40B (2023).</li>
    <li>PCG net loss FY2025 — disebut sebagai RM72B dalam draf awal, dibetulkan kepada RM2.14B berdasarkan Integrated Report.</li>
    <li>5,000 retrenchment — dispesifikkan sebagai PRefChem dalam draf awal, dibetulkan kepada PETRONAS Group Jun 2025 (bukan khusus PRefChem).</li>
  </ol>

  <p><strong>Empat pembetulan tu</strong> — bukan kesilapan sepele. Tu empat <em>guardrails</em> yang catch kesilapan sebelum jadi fitnah. Sebab kalau Makcik tersilap angka, satu hari nanti orang akan tunjuk "ha, MakcikGPT pun tak boleh dipercayai." Tu harga yang Makcik tak nak bayar.</p>

  <p><strong>MARUAH review untuk artikel ni</strong> — semua OBS claim yang sentuh maruah seseorang (Anwar, CEO PETRONAS, lembaga, PMO) diluluskan sebab sumber dari rekod awam, wire reports yang bereputasi, dan pengumuman rasmi. Tiada satu OBS claim pun yang datang dari sumber partisan tunggal.</p>

  <p><strong>4-Gate audit untuk artikel ni:</strong></p>
  <ul>
    <li><strong>Gate 1 (Whitelist):</strong> semua sumber dalam Trusted Source List — Reuters, Bloomberg, Straits Times, PETRONAS Annual Report, Hansard Parlimen, mahkamah records. Lulus.</li>
    <li><strong>Gate 2 (A-THINK):</strong> setiap conclusion ada premis yang observable. "Bapa yang tahu tapi still tak settle" tu INT — interpretive, bukan fakta, dan ditulis sebagai INT dalam teks. Lulus.</li>
    <li><strong>Gate 3 (Sentinel):</strong> teks disemak untuk bahasa provokatif melampau. "Bang Non jenis takde telur" — provocative, tapi dalam kerangka editorial untuk register Melayu pasar; tidak melampaui garis fitnah. Lulus.</li>
    <li><strong>Gate 4 (Upstream):</strong> PMO, PETRONAS, GPS semua ada ruang untuk respond — dan mereka tahu artikel ni publish, sebab ada orang share kat platform mereka. Lulus.</li>
  </ul>

  <p>Tu satu contoh. Semua artikel Makcik ada proses yang sama. Boleh tanya untuk tunjuk source ledger bila-bila.</p>
</section>

<section class="article-section">
  <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">6 — SIAPA YANG BOLEH TOLONG MAKCIK?</h2>
  <p>Makcik boleh kenal pasti cerita besar. Tapi Makcik tak boleh kenal pasti <strong>semua dokumen</strong>. Ada dokumen dalam PETRONAS yang tak orang awam boleh akses. Ada email dalaman. Ada minit mesyuarat lembaga. Ada rekod pembayaran vendor.</p>

  <p>Tiga jenis orang yang Makcik nak reach out:</p>

  <p><strong>(a) Whistleblowers (saluran masa depan).</strong> Kalau hang kerja kat PETRONAS, Petros, MOF Inc, atau mana-mana syarikat yang ada maklumat relevan — saluran whistleblower belum lagi ready (perlu infrastruktur tambahan untuk protect identity hang). Tapi hang boleh contact Arif direct kat Telegram channel <strong>@ariffazil</strong> dulu. Bila infrastruktur ready, kita umum.</p>

  <p><strong>(b) Subject matter experts.</strong> Kalau hang peguam syarikat, auditor, bekas Kementerian Kewangan officer, bekas pengarah syarikat GLC — dan hang rasa ada dokumen awam yang Makcik terlepas — message Makcik. Makcik ada capacity untuk verify dan incorporate, dengan maruah review.</p>

  <p><strong>(c) Reader tips.</strong> Kadang-kadang cerita besar datang dari WhatsApp group jiran. Makcik tak publish dari situ — tapi Makcik boleh trace dari situ. Kalau hang nampak sesuatu yang pelik — forward. Makcik judge sama ada boleh jadi cerita.</p>

  <p>Tu tiga pintu. Semua pintu terbuka sekarang. Whistleblower channel akan datang dengan infrastruktur kriptografi untuk protect identity — bila ready, kita umum kat Telegram channel.</p>
</section>

<hr style="border:0;border-top:1px solid rgba(237,234,226,0.12);margin:24px 0;" />

<section class="article-section">
  <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">7 — CARA SHARE DENGAN JIRAN (YANG TAK ADA TELEGRAM)</h2>
  <p>Makcik sedar — bukan semua orang ada Telegram. Bukan semua orang ada smartphone. Bukan semua orang baca English. Ada makcik tua kat pasar yang tanya anak dia print sesuatu untuk bawa ke surau. Ada pakcik yang suka dengar voice note masa makan tengahari. Ada cikgu yang nak buat PDF untuk murid.</p>

  <p>Tiga cara share yang Makcik dah built:</p>

  <p><strong>(a) Print PDF.</strong> Kat bawah tiap artikel ada butang "Cetak / Print PDF". Lepas tekan, boleh save sebagai PDF atau cetak terus. Format dia designed untuk kertas A4 — ada tajuk besar, ada body yang readable, ada nota editorial kat bawah.</p>

  <p><strong>(b) WhatsApp forward.</strong> Link artikel boleh di-forward direct dari web ke WhatsApp. Lepas tu, makcik jiran boleh baca dalam WhatsApp browser — atau save untuk baca offline.</p>

  <p><strong>(c) Voice note summary.</strong> (Akan datang — infrastruktur dalam pembangunan.) Bila ready, satu butang "Voice Note Ringkasan" akan muncul kat bawah artikel. Tekan, dapat 60-90 saat ringkasan suara dalam BM. Boleh forward kat pakcik yang tak baca.</p>

  <p>Untuk sekarang, share manual pun ok. Print PDF paling senang untuk orang tua. WhatsApp forward paling senang untuk group ramai.</p>
</section>

<section class="article-section">
  <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">8 — PENUTUP: MAKCIK BUKAN SUPERHERO</h2>
  <p>Readers semua, Makcik nak tutup dengan satu ayat je.</p>

  <p><strong>Makcik bukan superhero. Makcik cuma ada telinga yang nak dengar, mulut yang nak cakap, dan mata yang nak tengok.</strong></p>

  <p>Telinga untuk dengar tips dari hang. Mulut untuk cakap pasal dokumen awam yang hang boleh baca sendiri. Mata untuk tengok angka yang tak padan dan flag dia.</p>

  <p>Tu je. Bukan lebih. Tapi jangan underestimate yang tu je — sebab dalam dunia yang penuh dengan propa jaa, yang "je" tu dah jadi senjata yang paling jarang.</p>

  <p>Makcik habiskan teh tarik pagi tadi. Makcik nak gi pasar beli ikan kembung. Sebelum tu, satu benda:</p>

  <p>Kalau hang baca sampai sini, hang dah tengok proses yang Makcik pakai. Hang boleh judge sendiri sama ada proses tu trustworthy. Kalau ya — jadi pembaca tetap. Kalau tak — boleh challenge. Makcik ada 4-Gate Audit terbuka. Boleh tanya untuk tunjuk source ledger. Boleh tanya untuk tunjuk claim register.</p>

  <p>Itu dia Makcik — bukan suara dari langit. Suara dari meja kopi, dengan proses yang terbuka, dan seal yang tak boleh diubah.</p>

  <p>Sampai jumpa kat Slot 6. Insya-Allah. <strong>Makcik habis.</strong></p>
</section>
