# ═══════════════════════════════════════════════════════════════════════════
# STAGED — NOT APPLIED. Machine-readable route honesty.
# ═══════════════════════════════════════════════════════════════════════════
# Failure class: a path ending in a machine-readable suffix that has no
# backing file falls through to the SPA catch-all and returns
#   200 text/html
# A lenient agent parses HTML as JSON and fails far from the cause; a strict
# agent is told the artifact exists when it does not. 404 is cheaper and true.
#
# Live evidence (2026-10-28): /receipts/index.json, /governance/index.json,
# /governance/authority-model, /governance/authority-model.json,
# /world/index.json all return 200 text/html.
#
# TARGET FILE:  /etc/caddy/vhosts/arif-fazil.com.conf
# INSERT POINT: immediately BEFORE the SPA catch-all handle
#               (current line 2488: `handle {`)
# ROOT:         /var/www/html/arif   (as used by the surrounding handles)
#
# Semantics: try_files resolves a real file if one exists, otherwise 404.
# No existing .json path changes behaviour — they all have backing files or
# their own earlier handle. Only the phantom ones start telling the truth.
# ═══════════════════════════════════════════════════════════════════════════

	# ── machine-readable suffix must resolve or 404, never fall back to the SPA ──
	@machine_suffix path *.json *.jsonld *.webmanifest *.ndjson
	handle @machine_suffix {
		root * /var/www/html/arif
		try_files {path} =404
		file_server
	}

# ═══════════════════════════════════════════════════════════════════════════
# APPLY (Arif only — not run by FI-002)
#   cp /etc/caddy/vhosts/arif-fazil.com.conf \
#      /etc/caddy/vhosts/arif-fazil.com.conf.bak-$(date -u +%Y%m%dT%H%M%SZ)
#   # insert the block above, then:
#   caddy validate --config /etc/caddy/Caddyfile
#   systemctl reload caddy
#
# VERIFY (post-reload, must all pass)
#   curl -s -o /dev/null -w '%{http_code} %{content_type}\n' \
#     https://arif-fazil.com/receipts/index.json          # expect 404
#   curl -s -o /dev/null -w '%{http_code} %{content_type}\n' \
#     https://arif-fazil.com/.well-known/capabilities.json # expect 200 application/json
#   curl -s -o /dev/null -w '%{http_code} %{content_type}\n' \
#     https://arif-fazil.com/discovery/index.json          # expect 200 application/json
#
# ROLLBACK
#   cp /etc/caddy/vhosts/arif-fazil.com.conf.bak-<ts> \
#      /etc/caddy/vhosts/arif-fazil.com.conf && systemctl reload caddy
#
# RISK: medium. A mis-scoped matcher could 404 a .json path that currently
# works. Mitigated by try_files {path} =404 — real files still serve.
# ═══════════════════════════════════════════════════════════════════════════
