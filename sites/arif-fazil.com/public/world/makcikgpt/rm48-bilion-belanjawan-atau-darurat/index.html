      <article lang="ms" data-makcik-slug="rm48-bilion-belanjawan-atau-darurat" data-makcik-date="2026-10-05" style="padding:2rem;max-width:48rem;margin:0 auto;font-family:Georgia,serif;color:#EDEAE2;background:#0A0B0D;line-height:1.6;">
        <p style="font-family:monospace;color:#D9A62E;font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;">MakcikGPT · Civic Intelligence · 2026-10-05</p>
        <article class="makcik-article" lang="ms">
          <section class="article-section article-opener">
            <blockquote style="border-left:4px solid #D9A62E;background:#11151C;padding:16px 20px;margin:16px 0 24px;font-style:italic;color:#EDEAE2;font-size:1.05em;line-height:1.6;">
              "Makcik tak kisah Anwar baca belanjawan macam kerani. Makcik kisah — kita semua kena baca macam orang yang duit poket sendiri tengah kena tarik keluar."
            </blockquote>
          </section>

          <hr style="border:0;border-top:1px solid rgba(237,234,226,0.12);margin:24px 0;" />

          <section class="article-section">
            <p><strong>ALAMAK READERS SEMUA.</strong> Hari ni 5 Oktober 2026. Dalam empat hari — 9 Oktober 2026 — Anwar akan berdiri kat Parlimen, baca Belanjawan 2027. Dia akan senyum, dia akan angkat tangan kiri, dia akan sebut "pertumbuhan inklusif," "masa depan mampan," dan nama-nama program baharu yang kita takkan ingat tiga bulan lagi.</p>
            <p>Tapi kat belakang semua kerusi malas tu, ada satu nombor yang BERGERAK. Satu nombor yang minggu ni tukar dari teori jadi duit panas.</p>
            <p><strong>RM48 bilion.</strong></p>
            <p>Tu dividen PETRONAS yang <em>berpotensi</em> masuk untuk tahun fiskal 2026 — menurut nota BIMB Securities yang Utusan Malaysia lapik 3 Oktober 2026. Baseline Bajet 2026 sekarang cuma RM20 bilion. Maknanya, jika angka BIMB tepat, kerajaan boleh dapat <strong>+RM28 bilion (+140%)</strong> tambahan, di atas apa yang dah dijangka dalam belanjawan asal.</p>
            <p>Makcik, angka macam tu bunyi macam hari raya. Tapi tunggu — ada masalah besar dalam sampul hari raya tu. Ia bukan duit percuma. Ia <em>duit yang kita sudah bayar dari poket sendiri</em>, dan ia datang dengan tanda soal yang lebih besar dari dividen tu sendiri.</p>
          </section>

          <hr style="border:0;border-top:1px solid rgba(237,234,226,0.12);margin:24px 0;" />

          <section class="article-section">
            <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">1) RM48B BUKAN "KABAR BAIK" — IA "SHOCK ABSORBER"</h2>
            <p>Hang dengar, lepas tu fikir betul-betul. Kenapa Utusan lapik nota BIMB tu <em>sekarang</em>, 6 hari sebelum Belanjawan?</p>
            <p>Jawab: sebab Anwar perlu satu alasan untuk nampak stabil. Kita (siri m6-2 + m6-3 dah cerita) tahu — <strong>PETRONAS</strong> ialah 100% milik MoF Inc. MoF Inc ialah Menteri Kewangan. Menteri Kewangan sekarang ialah <strong>Anwar</strong> sendiri. PM + MoF dalam satu tangan. Bermakna, tiap sen dividen dari PETRONAS masuk ke tangan yang sama — tangan yang kena bentang belanjawan kat Parlimen empat hari lagi.</p>
            <p>Bayangkan — hang ada anak, hang kena bayar hutang RM100. Tiba-tiba atuk bagi hang RM48 dan cakap "tengok, atuk tolong." Anak tu nampak macam ada duit. Tapi hakikatnya <strong>RM48 tu bukan pendapatan — ia penahan kejatuhan</strong>. Hutang tetap RM100. Pendapatan tetap sama.</p>
            <p>Dalam kes Malaysia: <strong>Debt/GDP sekarang 63.1%</strong> (ikut /wealth/malaysia/, sealed 24 Julai 2026). Siling statutorinya 65%. Jarak dari jurang cuma 1.9 mata peratus. Kalau Brent kekal USD95+, subsidi bahan api mencecah RM50 bilion — itu je dah makan separuh potensi dividen tambahan. <strong>Defisit 3.8%</strong> dari GDP — sudah 1.2 mata peratus dari ambang semakan penarafan 5%.</p>
            <p>Jadi RM48B tu bukan "bonus." Ia <em>shock absorber</em> — macam absorber kereta. Kalau langgar kuat, ia kecut. Kalau langgar sederhana, ia bertahan. Tapi absorber bukan enjin. Ia tak jana kuasa.</p>
            <p>Petronas sendiri ada tunai RM193.6 bilion (30 Jun 2026, /vitals/) — nampak besar, tapi hutang kumpulan RM126.8 bilion, gearing 21.2%. Nisbah tunai-ke-hutang semakin ketat. Tahun 2027 angka tu mungkin turun lagi.</p>
          </section>

          <hr style="border:0;border-top:1px solid rgba(237,234,226,0.12);margin:24px 0;" />

          <section class="article-section">
            <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">2) EXTRACTION RATIO 105.7% — MAKNA BAYAR DARI SIMPANAN, BUKAN UNTUNG</h2>
            <p>Ini nombor yang paling takut. Makcik, biar perlahan.</p>
            <p><strong>Extraction ratio 105.7%</strong> — bermaksud PETRONAS akan bayar dividen 5.7% <em>melebihi</em> untung tahunannya (PAT FY2025 RM45.4 bilion). Maknanya: duit yang diagih kepada kerajaan <strong>bukan dari keuntungan tahun ni</strong>. Ia dari simpanan yang ada, dari minyak yang telahpun dikeluarkan, dari masa depan yang digadai hari ini.</p>
            <p>Fikir macam ni: hang ada akaun simpanan RM50. Tahun ni, hang cuma tambah RM5 (untung). Tapi hang hantar RM10 kat mak kat kampung. Habis lauk, kan? Begitulah extraction ratio lebih 100% — hang dah makan modal.</p>
            <p>Kenapa boleh jadi macam ni? Sebab:</p>
            <ul>
              <li>Untuang FY2025 PETRONAS jatuh 17.6% (RM45.4B dari RM55B FY2024).</li>
              <li>Tong yang boleh dijual pun jatuh 2 tahun berturut-turut: 9.35B → 8.64B → 7.92B tong (ikut /vitals/, plot dual-clock).</li>
              <li>Downstream (Pengerang) rugi RM15.2B FY2024 — separuh tahun ni "diselamatkan" oleh tangkapan lama RM14.8B. Tanpa tangkapan itu, hiliran sebenarnya untung RM7B. Itu pun tak cukup.</li>
            </ul>
            <p>Jadi soalnya: <strong>kalau tahun depan untung turun lagi, dividen RM48B tu datang dari mana?</strong> Dari mana? Hutang? Jual aset? Lebur lagi banyak Pengerang?</p>
            <p>Makcik tak tau. PETRONAS pun tak berani jawab lagi. Tapi nombor 105.7% tu — ia bukan neutral. Ia amaran.</p>
          </section>

          <hr style="border:0;border-top:1px solid rgba(237,234,226,0.12);margin:24px 0;" />

          <section class="article-section">
            <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">3) RIGHTSIZING + DIVIDEN NAIK — BUKAN KEBETULAN</h2>
            <p>Hang tau tak, rightsizing 5,000 orang PETRONAS berlaku awal 2026. <em>PADA MASA YANG SAMA</em> dividen diisytihar RM20B (26 Februari 2026) — dan sekarang prospek naik ke RM48B.</p>
            <p>Korelasi tu bukan kebetulan. Ia satu formula: <strong>buang kos pekerja → naikkan dividen → penuhi jangkaan bajet → kekalkan kerusi PMX.</strong></p>
            <p>Itu bukan governance. Itu taktik survival. Bayangkan — anak syarikat untung RM45B, bayar dividen RM48B, sambil buang 5,000 orang. Anak syarikat mana yang buat macam tu? Anak syarikat yang tau <em>bosnya (kerajaan) perlukan duit lebih dari keperluan perniagaan</em>.</p>
            <p>Maka, setiap kali 5,000 manusia hilang pekerjaan, sebahagian dari RM48B tu ialah <strong>duit gaji yang tak dibayar</strong>. Ia bukan "kita jadi efisien" — ia "kita pindahkan kos dari syarikat negara ke jalan-jalan Brickfields, Taman Tun, dan Butterworth, sementara dividen diterbang ke Putrajaya."</p>
            <p>Itu pilihan. Bukan kebetulan.</p>
          </section>

          <hr style="border:0;border-top:1px solid rgba(237,234,226,0.12);margin:24px 0;" />

          <section class="article-section">
            <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">4) TIGA LOOPHOLE — DAN SATU YANG RAMAI TAK PERNAH DENGAR</h2>
            <p>Ramai orang — termasuk ahli Parlimen, netizen Twitter, blogger — salahkan Akta Syarikat 2007. "Kenapa PETRONAS tak bagi data penuh? Kenapa orang awam tak boleh audit?"</p>
            <p>Tu soalan yang salah. <strong>PETRONAS bukan syarikat biasa</strong>. Ia beroperasi di bawah Petroleum Development Act 1974 (PDA 1974), bukan Akta Syarikat 2007. PDA 1974 bagi PETRONAS satu loopholes yang tiga lapis — dan satu daripadanya ramai terlepas pandang:</p>
            <ol>
              <li><strong>Loop 1 — Laporan Kewangan.</strong> PETRONAS hanya wajib bentang akaun di Parlimen, bukan kepada orang awam. Maksudnya, kita nampak nombor setelah Parlimen lulus. Bukan sebelum, bukan semasa, bukan dibuka untuk diaudit oleh pihak ketiga. Akaun tertakluk kepada "Menyimpan Akta — Section 4 PDA 1974" yang kekal rahsia. Jadi apa-apa audit, walau oleh KPMG Deloitte, datang <em>selepas</em> Parlimen lulus — audit bukan veto, hanya cop.</li>
              <li><strong>Loop 2 — Dividen = Apa Yang MoF Nak.</strong> Mengikut Seksyen 3(2) PDA 1974, dividen PETRONAS bukan hak shareholder — ia adalah "wang yang boleh dibayar" seperti yang diarahkan Menteri Kewangan. Tiada formula. Tiada peratusan tetap. Anwar (sebagai MoF) boleh tekan sebarang angka yang dia mahu, dan PETRONAS wajib bayar (melalui cash reserves, hutang, atau apa-apa yang PM perlukan). Extraction ratio 105.7%? Ia bukan kemalangan, ia <em>kuasa</em>.</li>
              <li><strong>Loop 3 — Yang Ramai Tak Pernah Dengar: Integrasi Sarawak.</strong> Sejak Julai 2025, panel 5-hakim Federal Court lulus <em>justisiability</em> cabaran Sarawak terhadap constitutionaliti PDA 1974. Ini bukan saman biasa — ia membuka kemungkinan seluruh petroleum regime 1974-2026 dicabar: kontrak JV, lesen, downstream. Dan Anwar (seri m6-3, bang-non-pergi-kuching) ambil laluan termudah: bagi Sarawak RM1.5 bilion geran khas interim 16 Sept 2026 — <em>tanpa agreement, tanpa formula, tanpa tandatangan kekal</em>. Itu bukan penyelesaian. Ia cap waktu. Macam yang kita tahu, keputusan penuh mahkamah belum keluar.</li>
            </ol>
            <p>Ketiga-tiga loopholes tu bermaksud satu benda: <strong>tiada siapa boleh halang kerajaan dari "menarik" apa yang dia nak dari PETRONAS</strong>, atas nama "kepentingan negara." Dan tiap kali kita tanya, jawapannya "rahsia kerajaan."</p>
            <p>Jadi — Belanjawan 9 Oktober bukan soal berapa banyak peruntukan untuk subsidi, berapa untuk bantuan, berapa untuk gaji. Ia soal: <strong>berapa dalam lagi PM boleh gali lubang RM48B sebelum lubang tu jadi lubang kubur?</strong></p>
          </section>

          <hr style="border:0;border-top:1px solid rgba(237,234,226,0.12);margin:24px 0;" />

          <section class="article-section">
            <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">5) EMPAT HARI AKAN DATANG — APA RAKYAT PATUT TONTON</h2>
            <p>Empat hari, empat acara. Setiap satu kita patut tonton dengan mata terbuka dan telinga yang tak diletakkan dalam mulut manusia:</p>
            <ul>
              <li><strong>9 Oktober 2026 (Jumaat):</strong> Anwar bentang Belanjawan 2027. Kita tengok — berapa banyak peruntukan subsidi (jika Brent kekal USD95+)? Berapa banyak suntikan ke FELDA, RISDA, FELCRA? Berapa banyak duit "penyelidikan" yang tak pernah tiba kat kampung? <em>Cross-link: Dossier 01 — PETRONAS Full Reality, Sealed 27 Sept 2026.</em></li>
              <li><strong>31 Disember 2026:</strong> Tarikh jangka siap EnQuest deal — pemerolehan oleh PETRONAS. Berapa nilai akhir? Berapa banyak saham yang di-issu? Berapa hutang baru yang PETRONAS pikul? <em>Cross-link: Dossier 02 — Gas Sarawak & PDA 1974, dokumen siri m6-3.</em></li>
              <li><strong>Februari 2027:</strong> Akaun penuh PETRONAS FY2026 — akan didedahkan, akhirnya, berapa untung sebenar, berapa dividen sebenar, berapa cash flow. Ini hari di mana kita boleh cross-check dengan nota BIMB. Jika RM48B tak masuk, nota BIMB ialah "berharap." Jika ia masuk — extraction ratio akan lebih teruk.</li>
              <li><strong>30 September 2027:</strong> Akaun pertama syarikat London rakan kongsi (EnQuest PLC) — setahun penuh di bawah PETRONAS. Akaun UK lebih terbuka dari akaun kita. Ia akan jadi satu-satunya jendela di mana kita boleh nampak dengan jelas apa yang PETRONAS buat di luar pagar. Tunggu nombor UK itu — itu cek paling jujur.</li>
            </ul>
            <p>Empat tarikh tu. Macam 4 cermin. Letak muka hang depan setiap satu — baru hang nampak siapa sebenarnya yang sedang bercakap kat Parlimen.</p>
          </section>

          <hr style="border:0;border-top:1px solid rgba(237,234,226,0.12);margin:24px 0;" />

          <section class="article-section">
            <h2 style="font-family:Georgia,serif;font-size:1.6em;font-weight:700;color:#EDEAE2;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1F2733;line-height:1.2;">PENUTUP — MAKCIK TIDUR, RAKYAT JAGA</h2>
            <p>Hang baca semua ni, hang pening. Biasa la. Makcik sendiri pening. Tapi makcik nak tutup dengan satu benda yang Hang boleh bawa balik ke rumah:</p>
            <p><strong>Tidak kisah siapa bagi Hang RM48B, jika Hang tak faham dari mana asalnya, Hang bukan sedang diberi — Hang sedang dicuri.</strong></p>
            <p>Kerana setiap RM1 yang PETRONAS bayar dari simpanan (bukan untung), setiap RM1 yang 5,000 orang pekerja yang dibuang tak dapat gaji lagi, setiap RM1 subsidi yang kita tanggung dari cukai jalan dan cukai pendapatan — semua tu duit kita. Ia bukan duit misteri dari langit. Ia duit yang sudah dipotong dari poket Hang sebelum Hang nampak potongannya.</p>
            <p>RM48B tu bukan bonus. Ia <em>ikat pinggang kita yang ditarik longgar sedikit</em> — sementara tangan satu lagi gali lubang lain di belakang.</p>
            <p>Lain kali hang dengar "dividen PETRONAS naik RM28 bilion" — jangan angkat tangan syukur. Angkat tangan soal. Tanya: "Dari mana? Siapa bayar? Berapa lama boleh continue?"</p>
            <p>Itu beza antara suara yang letak dalam mulut manusia, dengan suara yang hanya pandai sebut nama-nama program yang tak pernah Hang jumpa.</p>
            <p>Empat hari lagi. Bangun awal, baca teks belanjawan sendiri, jangan percaya ringkasan media. Makcik dah agak Hang yang akan jadi hakim paling susah untuk Anwar dalam empat hari ni — bukan Parlimen, bukan blogger, bukan Twitter. <strong>Hang — orang kampung, orang pasar, orang yang duit poket sendiri yang kena tarik.</strong></p>
            <p>Kita jumpa lagi lepas 9 Oktober. Doakan yang terbaik, bersedia untuk yang terburuk, dan jangan lupa — suara Hang yang asli tak boleh dibuat oleh mana-mana mesin di dunia ni.</p>
          </section>
