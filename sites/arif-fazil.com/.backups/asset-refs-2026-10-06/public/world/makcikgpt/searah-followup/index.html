<h1>SEARAH Dah Beroperasi — Tapi Bocor Pun Dah Sampai Mahkamah</h1>
<p><strong>1 Julai 2026, SEARAH mula operasi. Esoknya, mahkamah dengar: bekas manager PETRONAS bocorkan rahsia pada PETROS. CEO PETROS pun bekas PETRONAS. Makcik, siapa jaga gas kita?</strong></p>
<p><strong>999 Meterai | Versi 1.0 Bahasa Makcik | 1 Julai 2026</strong></p>

<hr />

<h2>Hai Makcik! Ingat Cerita SEARAH?</h2>

<p>Dalam artikel <strong>"Kenapa Gas Sarawak Punya Dah Masuk Tangan Orang Italy?"</strong>, Makcik cerita pasal satu syarikat baru — <strong>SEARAH LIMITED</strong> — 50% PETRONAS, 50% Eni Italy, daftar kat London, mula operasi <strong>1 Julai 2026</strong>.</p>

<p>Hari ni dah 1 Julai. SEARAH dah mula.</p>

<p>Tapi Makcik, sementara SEARAH start, ada satu cerita lain yang <strong>lebih panas</strong> sedang berlangsung kat Mahkamah Sesyen Kuala Lumpur. Cerita pasal <strong>bekas manager PETRONAS yang bocorkan rahsia syarikat pada PETROS</strong>.</p>

<p>Mari Makcik cerita.</p>

<hr />

<h2>Cerita Bocor: Bekas Manager PETRONAS, Surat Kepada CEO PETROS</h2>

<p>Nama dia <strong>Mohd Khairul Akmal Mohd Jasni</strong>, 41 tahun. Dulu <strong>Business Unit Performance Manager</strong> di PETRONAS — orang yang siapkan laporan prestasi kewangan dan operasi huluan PETRONAS.</p>

<p>Pada <strong>8 Jun 2024, pukul 3:19 petang</strong>, dia hantar satu email dari akaun kerja PETRONAS dia. Kepada siapa?</p>

<div class="fact-box">
<div class="fact-box-title">▲ Kepada Dua Orang Kanan PETROS</div>
<div class="fact-box-content">
<strong>Datuk Janin Girie</strong> — CEO PETROS (bekas pekerja PETRONAS)<br>
<strong>Mohd Azha Abdul Jalil</strong> — CFO PETROS (ketua kewangan)<br>
<strong>Dokumen:</strong> "Q1 2024 Upstream Business Performance - Operational and Financial"<br>
<strong>Kandungan:</strong> Prestasi kewangan, jumlah pengeluaran, isu HSE, penemuan minyak & gas, pelaburan projek, penjualan aset termasuk di Sudan
</div>
</div>

<p>Dia guna <strong>email PETRONAS</strong>. Dari laptop PETRONAS. Pukul 3:19 petang, masa bekerja. Tak sembunyi langsung.</p>

<p>Bila disedari, PETRONAS buat laporan polis. Khairul Akmal didakwa di bawah <strong>Seksyen 203A(1) Kanun Keseksaan</strong> — mendedahkan maklumat sulit. Maksimum denda RM1 juta atau penjara setahun.</p>

<hr />

<h2>Apa Dalam Dokumen Tu?</h2>

<p>Dalam mahkamah, saksi pendakwaan — <strong>Syakirah Mustapa</strong>, General Manager PETRONAS — terangkan apa yang cuba dibocorkan:</p>

<ul>
<li><strong>Kekuatan kewangan</strong> — berapa duit PETRONAS ada</li>
<li><strong>Jumlah pengeluaran</strong> — berapa tong minyak dan gas</li>
<li><strong>Isu keselamatan dan alam sekitar</strong> — HSE issues</li>
<li><strong>Penemuan minyak dan gas baru</strong> — siapa dapat apa</li>
<li><strong>Pelaburan projek</strong> — duit pergi mana</li>
<li><strong>Penjualan aset</strong> — termasuk di Sudan</li>
</ul>

<p>Ini semua nombor yang sangat sensitif. <strong>Kalau PETROS dapat nombor ni, depa tahu berapa kuat PETRONAS, berapa lemah, kat mana boleh tekan.</strong></p>

<div class="pull-quote">
"Leak of this information could jeopardise the negotiation process between Petronas and Petros, potentially leading to negotiations that are disadvantageous to Petronas."
— Syakirah Mustapa, GM PETRONAS, dalam mahkamah, 26 Jun 2026
</div>

<p>Faham tak, Makcik? Bukan pasal jenayah semata. Tapi pasal <strong>rundingan PETRONAS vs PETROS</strong> yang sedang berlangsung — dan seorang bekas manager cuba bagi kelebihan pada sebelah pihak.</p>

<hr />

<h2>Yang Macam Lawak: CEO PETROS Pun Bekas PETRONAS</h2>

<p>Makcik, ni yang Makcik geleng kepala.</p>

<p>CEO PETROS — <strong>Datuk Janin Girie</strong> — adalah <strong>bekas pekerja PETRONAS</strong>. Sekarang dia jadi CEO syarikat negeri Sarawak yang nak ambil alih gas Sarawak dari PETRONAS.</p>

<p>Dan dia adalah penerima email yang mengandungi rahsia PETRONAS dari bekas pekerja PETRONAS.</p>

<p>PETROS kata depa <strong>"tak tahu"</strong> pasal kebocoran ni. Tapi surat tu sampai ke email CEO dan CFO. Macam mana CEO tak tahu email masuk?</p>

<div class="fact-box">
<div class="fact-box-title">▲ Rantaian Orang PETRONAS</div>
<div class="fact-box-content">
<strong>Khairul Akmal</strong> — manager PETRONAS, sekarang didakwa<br>
<strong>Janin Girie</strong> — CEO PETROS, bekas PETRONAS, penerima bocoran<br>
<strong>Azha Jalil</strong> — CFO PETROS, bekas PETRONAS, penerima bocoran<br>
<strong>Syakirah</strong> — GM PETRONAS, saksi pendakwaan<br>
<strong>Kesimpulan:</strong> PETRONAS lawan PETROS, tapi ramai orang PETRONAS kat kedua-dua belah. Macam main bola lawan adik sendiri.
</div>
</div>

<hr />

<h2>Sementara Tu, SEARAH Dah Mula</h2>

<p>1 Julai 2026. SEARAH mula operasi. 19 ladang. 300,000 tong sehari. USD 20 bilion pelaburan 5 tahun. $6 billion credit facility dari bank antarabangsa.</p>

<p>Dan PETRONAS-PETROS masih bertengkar kat Mahkamah Persekutuan. Dua kes sekali gus:</p>

<ul>
<li><strong>PETRONAS lawan Sarawak</strong> — cabar undang-undang negeri yang nak kawal gas</li>
<li><strong>Sarawak lawan Persekutuan</strong> — cabar tiga akta petroleum persekutuan</li>
</ul>

<p>Bayangkan, Makcik: satu pihak komit aset ke SEARAH (syarikat London). Satu pihak masih gaduh kat mahkamah pasal siapa punya gas. Dan manager yang cuba bocorkan rahsia — kes dia bersambung 7 Julai 2026.</p>

<p><strong>Semua ni jadi pada masa yang sama.</strong></p>

<hr />

<h2>Apa Maksud Semua Ni Untuk Makcik?</h2>

<p>Makcik, Makcik cuba ringkaskan:</p>

<ol>
<li><strong>Gas Sarawak dah masuk SEARAH.</strong> Operasi dah mula. USD 20 bilion. London.</li>
<li><strong>PETRONAS vs PETROS masih gaduh.</strong> Mahkamah Persekutuan, dua kes.</li>
<li><strong>CEO PETROS dapat bocoran rahsia PETRONAS.</strong> Bekas manager PETRONAS hantar email. Kes kat mahkamah.</li>
<li><strong>PETROS buka 30 stesen minyak.</strong> Sambil lawan, depa berkembang.</li>
<li><strong>Semua ni jadi serentak.</strong> Bukan kebetulan.</li>
</ol>

<p>Makcik, ni bukan satu cerita. Ni <strong>tiga cerita dalam satu masa</strong> — SEARAH, PETROS, mahkamah — semuanya pasal gas Sarawak. Tiga peristiwa, satu soalan: <strong>siapa sebenarnya yang kontrol gas kita?</strong></p>

<hr />

<h2>Yang Makcik Rasa</h2>

<p>Makcik rasa:</p>

<ol>
<li><strong>SEARAH dah jalan.</strong> Takde guna menangis. Tapi kena pantau: setahun dari sekarang, berapa hasil? Berapa duit balik ke Malaysia?</li>
<li><strong>Kes bocor ni bukan kecil.</strong> Kalau seorang manager boleh hantar rahsia PETRONAS ke PETROS, maknanya <strong>sistem keselamatan PETRONAS ada lubang</strong>. Lubang besar.</li>
<li><strong>CEO PETROS perlu jawab.</strong> Dia terima email tu. Dia tahu. Dia kena explain kenapa PETROS kata "tak tahu."</li>
<li><strong>Parlimen kena tanya.</strong> Bila SEARAH mula, siapa audit? Siapa pantau? Siapa jawab kat rakyat?</li>
</ol>

<h2>Penutup — Untuk Makcik dan Pakcik</h2>

<p>Makcik, zaman Makcik kecil dulu, gas Sarawak tu cerita jauh — "bukan urusan kita." Sekarang? Gas tu dah jadi milik syarikat London. Rahsia PETRONAS bocor ke PETROS. Mahkamah sibuk. Kerajaan senyap.</p>

<p>Ini bukan cerita jauh. Ni cerita <strong>dapur kita</strong>. Bila PETRONAS lemah, dividen kurang. Bila dividen kurang, subsidi tarik. Bila subsidi tarik, harga barang naik. Bila harga barang naik — Makcik yang rasa.</p>

<p>So Makcik pesan: <strong>jangan senyap.</strong></p>

<ul>
<li>Tanya Ahli Parlimen: "Encak, kes bocor PETRONAS-PETROS tu, siapa jawab?"</li>
<li>Tanya kawan yang keje PETRONAS: "Betul ke sistem keselamatan senang sangat nak bocor?"</li>
<li>Kongsi cerita ni — WhatsApp group jiran, group surau, group Rukun Tetangga.</li>
</ul>

<p>Sebab Makcik, gas ni bukan milik PETRONAS. Bukan milik PETROS. Bukan milik Eni. <strong>Gas ni milik kita — anak cucu kita.</strong> Kalau kita tak jaga, siapa lagi?</p>

<p><em>Ditempa Bukan Diberi.</em></p>
