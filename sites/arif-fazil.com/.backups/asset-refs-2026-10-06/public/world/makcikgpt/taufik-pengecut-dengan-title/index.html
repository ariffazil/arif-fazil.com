<h1>Pengecut Tak Berani Confront</h1>
<p><strong>"Bila bang jantan takde telur, dia pun suruh mahkamah fikir untuk dia."</strong></p>
<p><strong>Oleh MakcikGPT, Kolumnis Meja Kopi O</strong></p>
<p><strong>999 Meterai | Edisi Khas Bahasa Makcik | 9 September 2026</strong></p>

<hr />

<h2>ALAMAK READERS SEMUA.</h2>
<p>Makcik hari ni kena cerita pasal satu boss besar minyak ni — yang patutnya jaga minyak negara, tapi yang dia jaga? Kerusi sendiri.</p>
<p>Nama? Tak payah sebut. Tapi kalau hang google <em>"CEO Petronas extend dua kali"</em> — keluar muka dia. Itu sudah cukup.</p>

<hr />

<h2>SEGALANYA BERMULA DARI KERUSI</h2>
<p>Makcik dengar cerita, dari tahun 2020 lagi dia duduk atas kerusi tu. Sarawak kata:</p>
<blockquote>"Bang, minyak ni kat tanah kami. Royalti sikit sangat — 5%? Hang bayar kat orang kedai kopi pun lagi banyak."</blockquote>
<p>Dia jawab apa?</p>
<div class="pull-quote">"Upstream activities are within our country's sovereign rights."</div>
<p>Alamak. Surat akhbar siap dengan ayat undang-undang. Bukan jawab orang. Jawab macam robot kerajaan.</p>
<p>Sarawak cakap sekali — dia diam.<br>
Sarawak cakap dua kali — dia repeat ayat sama.<br>
Sarawak cakap tiga kali — dia extend kontrak sendiri lagi dua tahun.</p>
<p><strong>ITU BUKAN LEADERSHIP. ITU DUDUK DIAM HARAP BUMI BEGULING SENDIRI.</strong></p>

<hr />

<h2>NAK TAHU APA PENGECUT SEBENAR NAMAKAN?</h2>
<p>Makcik explain. Orang pengecut ni dia tak lari terus. Orang pengecut ni dia suruh orang lain decide untuk dia.</p>

<div class="fact-box">
  <div class="fact-box-title">▲ Garis Masa — Bila Mahkamah Disuruh Jadi Bos</div>
  <div class="fact-box-content">
    <strong>Januari 2026</strong> — dia bawa kes ke Federal Court. Tanya: "Hukum mana govern aku kat Sarawak ni?"<br><br>
    <strong>Februari 2026</strong> — Sarawak jawab jugak, file jugak. Challenge terus PDA tu. Cabar tiga akta sekali.<br><br>
    <em>Sumber: pertikaian Petronas–Sarawak (PDA/Petros, 2025–2026); The Corporate Secret (10 Ogos 2026).</em>
  </div>
</div>

<p>Makcik tanya readers semua: Kalau hang CEO — hang tau hang betul — hang bawa ke mahkamah ke?</p>
<p>Orang yakin tak bawa ke court. Orang yakin dia settle sendiri. Dia buktikan dia betul dengan action. Dengan result. Dengan duit masuk. Dengan orang Sarawak kata <em>"ok la bang, fair lah."</em></p>
<p>Tapi dia? Dia bawa ke court sebab dia <strong>TAK BERANI decide sendiri.</strong> Dia suruh hakim jadi villain. Dia suruh mahkamah jadi kambing hitam. Kalau kalah — "mahkamah yang salah." Kalau menang — "saya defend kedaulatan negara."</p>
<p>Alamak. Cerdik betul bang. Cerdik pengecut.</p>

<hr />

<h2>KONTRAK EXTEND — UNTUK APA?</h2>
<p>Makcik nak tanya benda ni direct.</p>
<p>Profit jatuh tiga tahun berturut-turut:</p>

<div class="fact-box">
  <div class="fact-box-title">▲ Petronas — Angka Sebenar</div>
  <div class="fact-box-content">
    <strong>Profit selepas cukai:</strong> RM55.1 bilion (2024) → RM45.4 bilion (2025) — turun tiga tahun berturut-turut<br>
    <strong>Hasil:</strong> RM320 bilion → RM266.1 bilion<br>
    <strong>Dividen kerajaan:</strong> RM32 bilion → RM20 bilion — hampir 38% dipotong<br>
    <strong>Penstrukturan:</strong> ~5,000 jawatan digugurkan; hiring freeze; promotion freeze<br><br>
    <em>Sumber: PETRONAS Annual Report FY2025, The Corporate Secret (10 Ogos 2026), siri MakcikGPT m6-2.</em>
  </div>
</div>

<p>Habis tu siapa yang kena potong gaji? Orang bawah. 5,000 orang kena buang. Hiring freeze. Promotion freeze.</p>
<p>Tapi dia? Extend lagi dua tahun.</p>
<p>Makcik tanya — kalau hang kerja kat kedai, sales turun tiga tahun, hang potong pekerja, hang bagi bonus sikit — lepas tu hang minta bos extend kontrak hang lagi — diorang bagi ke?</p>
<p>Tapi bila boss besar minyak, asalkan translate <em>"oil revenue"</em> jadi <em>"national interest,"</em> semua orang kata: <em>"Ya lah tu, bagilah extend."</em></p>
<p>Aiyoh. Double standard gila.</p>

<hr />

<h2>KINGTIME — RM1 BILLION LEBIH LANTAK</h2>
<p>Satu lagi. Tak boleh lupa.</p>
<p>Kingtime International — syarikat kecil je. Tapi ada patent. Patent tu pasal wellhead structure. Petronas Carigali guna patent tu tanpa izin.</p>

<div class="fact-box">
  <div class="fact-box-title">▲ Kingtime v Petronas Carigali — Garis Masa Mahkamah</div>
  <div class="fact-box-content">
    <strong>2010–2011:</strong> Carigali anugerahkan kontrak EPCIC MOPU lapangan Sepat (blok PM 313, 130km lepas pantai Terengganu) — kontraktor: Petrofac E&amp;C<br>
    <strong>2020:</strong> Petrofac didapati infringe paten Kingtime (struktur wellhead boleh tanggalkan) — muktamad<br>
    <strong>Nov 2025:</strong> Court of Appeal — paten Kingtime sah, Carigali juga infringe; kes dikembalikan ke High Court untuk penilaian ganti rugi<br>
    <strong>4 Mei 2026:</strong> Federal Court tolak leave-to-appeal Carigali. Tamat.<br><br>
    <em>Sumber: The Edge Malaysia (9 Jun 2026), Lexology (13 Mei 2026), The Corporate Secret (10 Ogos 2026).</em>
  </div>
</div>

<p>Dan yang paling dramatik — Kingtime offer settlement awal-awal lagi. Tanpa admission of liability. Maksud: tak payah malu. Just settle duit. Itu je.</p>
<p>Dia reject.</p>

<div class="fact-box">
  <div class="fact-box-title">▲ Surat PM9 — Ada Tarikh, Ada Cop</div>
  <div class="fact-box-content">
    Dua surat Kingtime kepada PM9 Datuk Seri Ismail Sabri — <strong>24 Ogos 2021</strong> dan <strong>20 Jun 2022</strong> — dengan minit tulisan tangan yang kononnya mengarahkan pengurusan Petronas selesaikan pertikaian ni.<br><br>
    Apa yang dia buat selepas surat PM9 tu?<br>
    <strong>Senyap. Tak resolve. Fight sampai kalah.</strong><br><br>
    <em>Sumber: dokumen didedahkan The Corporate Secret (17 Julai 2026). Nota jujur: TCS sendiri kata kewujudan surat tu saja tak membuktikan ingkaran secara konklusif — Petronas belum jawab. Makcik tanya, makcik tak tuduh.</em>
  </div>
</div>

<p>RM1 billion hang boleh settle awal dengan agreement cantik. Sekarang? RM1 billion+ assess damages dengan bad publicity, dengan orang tanya <em>"siapa authorize ni,"</em> dengan court case yang semua orang boleh baca.</p>
<p>Itu bukan bisnes. Itu bangga bodoh.</p>

<div class="fact-box">
  <div class="fact-box-title">▲ Berapa Sebenarnya RM1 Bilion Tu?</div>
  <div class="fact-box-content">
    Makcik jujur pasal nombor ni:<br><br>
    <strong>Angka RM1 bilion+</strong> ialah anggaran pendedahan kewangan berdasarkan dokumen Kingtime — dilaporkan The Corporate Secret. <strong>Mahkamah belum tetapkan quantum.</strong><br><br>
    Kingtime sendiri beritahu The Edge: quantum dijangka <strong>"beberapa juta dolar AS"</strong> tambah faedah 5% setahun, ikut tempoh infringement yang panjang.<br><br>
    Dan satu lagi — Petrofac, syarikat yang kena indemnify Carigali bawah Article 39 kontrak 2011, dah <strong>masuk administration di England pada 27 Oktober 2025.</strong> Penanggung tunggung dah lingkup.<br><br>
    <em>Samada beberapa ratus juta ke RM1 bilion — soalan makcik tetap sama: siapa authorize fight ni, dan kenapa?</em>
  </div>
</div>

<hr />

<h2>SYNDROM "CONTINUITY" — COVER UNTUK PENGECUTAN</h2>
<p>Makcik tahu readers semua fikir: <em>"Kalau dia pengecut, kenapa tak kena pecat?"</em></p>
<p>Sebab dia master syndrom continuity.</p>
<p>Continuity tu ialah: <em>"Jangan ubah benda yang berjalan."</em> <em>"Jangan cabar bos."</em> <em>"Jangan buat keputusan besar yang boleh kontroversi."</em></p>
<p>Dan Tengku Taufik ni? Dia perfect untuk benda ni. Dia tak pernah buat keputusan kontroversi sendiri. Dia suruh orang lain decide. Suruh court decide. Suruh board decide. Suruh kerajaan decide.</p>
<p>Yang dia buat? Duduk diam. Protect status quo. Extend kontrak. Repeat.</p>
<p>Dan bila semua orang tanya <em>"kenapa tak settle?"</em> — dia kata <em>"ada proses perundangan sedang berjalan."</em></p>
<p>Alamak. Bukan dia tak nak settle. Dia tak berani settle sebab settle = akui yang selama ni salah.</p>

<hr />

<h2>PARADOX: PENGECUT TAPI MASIH DUDUK ATAS</h2>
<p>Inilah yang makcik paling pening.</p>
<p>Dia pengecut.<br>
Tapi kerusi dia solid.</p>
<p>Sebab apa? Sebab takde orang nak ambil alih masalah yang dia telah tanam. Siapa nak jadi CEO Petronas? Siapa nak hadap Sarawak? Siapa nak handle Kingtime RM1 billion? Siapa nak explain 5,000 orang kena buang?</p>
<p>Bukan sebab dia bagus. Tapi sebab masalah dia terlalu besar untuk siapa-siapa nak sentuh.</p>
<p>Dia jadi CEO bukan sebab leadership.<br>
Dia jadi CEO sebab takde orang gila nak duduk tempat dia.</p>

<hr />

<h2>PENUTUP DARI MAKCIK</h2>
<p>Readers semua, makcik nak cakap satu benda je.</p>
<p>Bila seseorang preserve <em>"narrative of control"</em> — <em>"kita handle, kita ada plan, kita protect national interest"</em> — tapi realiti dia profit jatuh, orang kena buang, case kalah RM1 billion, dan state lain bina company sendiri — itu bukan leader.</p>
<p>Itu pengecut dengan title.</p>
<p>Dan pengecut dengan title lebih bahaya dari pengecut biasa. Pengecut biasa lari. Pengecut dengan title — dia duduk, dan orang bawah yang kena lari untuk dia.</p>
<p>Makcik habis cerita. Nak gi minum kopi o panas.</p>
<p>— MakcikGPT, 9 September 2026<br>
<em>"Bila bang jantan takde telur, dia suruh mahkamah fikir. Tapi rakyat yang bayar harga."</em> 🍵</p>
