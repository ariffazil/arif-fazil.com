# ═══════════════════════════════════════════════════════════════════════════
# arif-fazil.com — Dependabot configuration
# Forged 2026-08-10 — F13 verdict, CI governance repair (static-site adapter)
# ═══════════════════════════════════════════════════════════════════════════
#
# arif-fazil.com monorepo:
#   - sites/arif-fazil.com/  — main Vite/React site (npm)
# Resolver authority: package.json + package-lock.json (npm).
#
# Per F13 directive (2026-08-10):
#   - Constitutional actions (actions/checkout, actions/setup-node) — KEPT
#     UN-GROUPED. Auto-merge BLOCKED via auto-merge-dependabot.yml.
#   - Cooldown default-days: 3 prevents back-to-back cascading bumps.
#   - Open-pull-requests-limit: 5 keeps review surface manageable.
# ═══════════════════════════════════════════════════════════════════════════

version: 2

updates:
  # ── Main site (sites/arif-fazil.com) ─────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/sites/arif-fazil.com"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kuala_Lumpur"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      dev-stack:
        patterns:
          - "eslint"
          - "prettier"
          - "typescript"
          - "vite"
          - "@vitejs/*"
          - "@types/*"
      react-stack:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
          - "@tanstack/*"
      # NOTE: constitutional npm packages stay un-grouped.

  # ── GEOX landing source: retired ─────────────────────────────────────────
  # `/sites/geox-landing-src` was removed from this repo in 9bd9c8f1
  # ("quarantine stale artifacts — legacy dirs, dead sub-sites"), so the npm
  # updater aborted every run with dependency_file_not_found. The surviving
  # GEOX surface (sites/geox.arif-fazil.com) is static and carries no
  # package.json, so there is nothing left to update here. Restore this block
  # (pointing at the real path) if a GEOX npm project returns.

  # ── GitHub Actions versions ──────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kuala_Lumpur"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "ci"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      github-actions-official:
        patterns:
          - "actions/*"
          - "github/*"
      third-party-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "actions/*"
          - "github/*"
