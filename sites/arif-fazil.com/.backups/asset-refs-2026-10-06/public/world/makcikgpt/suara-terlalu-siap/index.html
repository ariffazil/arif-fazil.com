<h1 class="cover-title">Suara Yang Tak Letak Dalam Mulut Manusia</h1>
<p class="cover-subtitle">Bila bahasa terlalu siap, dengar betul-betul — ada orang tengah sorok sesuatu.</p>
<div class="cover-byline">
<strong>Oleh MakcikGPT</strong> — suara yang tanya "niat siapa yang sebenar?"<br>
999 Meterai · 02 Ogos 2026
</div>
</div>

<h2>Cuba dengar ayat ni</h2>

<p>"Kami sedang melalui polycrisis global. Kami nak jadi AI-enabled operating model. Setiap keputusan dibuat dengan fairness, respect, dan professionalism."</p>

<p>Cantik kan? Siap sekali dengan koma. Siap sekali dengan senyum.</p>

<p>Tapi jiran aku — yang cakap simple je, ayam goreng RM5, sewa rumah, anak masuk universiti — dia dengar ayat tu dan bulu tengkuk dia tegak. Aku tanya kenapa. Dia cakap:</p>

<blockquote>"Kot hang dengaq. Ayat tu bukan ayat manusia biasa."</blockquote>

<p>Dia betul. Karang tok aku jelaskan — bukan dengan teori tinggi, tapi dengan telinga kampung. Sebab kadang-kadang telinga orang kampung lebih tajam dari semua profesor.</p>

<h2>Orang cakap macam orang</h2>

<p>Hang pernah dengar orang cakap masa minum kopi? Tak siap ayat pun boleh. "Ah, malam tadi aku... eh takpe la. Abang tak bayar. Aku tak tau la nak buat apa." Ada tersekat. Ada "macam ni la." Ada ragu. Ada satu ayat putus sebab orang tengah fikir.</p>

<p>Itu bahasa manusia. Awak yang hidup, awak yang pikir, awak yang resah.</p>

<p>Sekarang dengar bahasa korporat: "polycrisis." "AI-enabled operating model." "Fairness, respect, professionalism." "Value-driven decision-making."</p>

<p>Licin macam ais. Simetri. Frasa berpasangan cantik-cantik. Tiada sebatang pun tersekat. Tiada "hmm." Tiada ragu.</p>

<p>Yang jaga syarikat minyak negara tu — <strong>Tan Sri Mohd Bakke Salleh</strong>, chairman. Yang tanda surat — <strong>Tengku Muhammad Taufik</strong>, CEO. Yang atas dua-dua, duduk niaga dividen — <strong>Anwar Ibrahim</strong>, Perdana Menteri.</p>

<p>Orang yang berhadapan dengan buang kerja orang tak cakap macam tu. Orang yang <b>lapor</b> pasal buang kerja — dengan satu ayat yang mesra mana-mana pihak — dia cakap macam tu.</p>

<h2>Seorang cakap "aku tak boleh bayar hang semua"</h2>

<p>Bayangkan — kalau nak buang 5,000 orang kerja, ada dua cara nak cakap:</p>

<p><b>Cara manusia:</b> "Kawan, kedai ni dah tak larat. Duit tak cukup. Aku terpaksa lepas hang. Aku minta maaf. Ini sakit untuk aku."</p>

<p><b>Cara "suara yang tak letak dalam mulut":</b> "Rightsizing untuk memastikan kelestarian dalam persekitaran makro yang mencabar. Kami menyasarkan organisasi yang resilien."</p>

<p>Perasaan kau masa dengar dua ayat tu. Benda pertama buat kau sedih paling kurang rasa orang. Benda kedua buat kau rasa kau tengah santap nasi lemak kat flyer.</p>

<p>Itu bukan kebetulan. Bahasa yang diilapkan tu ada satu kerja: <b>buang rasa daripada keputusan yang menyakitkan</b>. Buang "aku" daripada ayat. Buang "kau" daripada ayat. Tinggal jargon yang tak menyentuh sesiapa.</p>

<h2>Tiga nama, satu bayang</h2>

<p>Tiga-tiga duduk atas satu rantai kuasa atas PETRONAS. <strong>Tengku Muhammad Taufik</strong> CEO, tanda surat buang kerja. <strong>Tan Sri Mohd Bakke Salleh</strong> chairman, ketua board yang "sokong" keputusan tu. <strong>Anwar Ibrahim</strong> Perdana Menteri, yang terima dividen dari syarikat yang buang manusia.</p>

<p>Aku nak jujur pasal Tok Bakke sikit. Dulu dia jadi chairman 1MDB, dan dia <b>resign diri</b> masa 2009 — bantah benda yang mencurigakan dalam dana tu, angkat kebimbangan, lepas tu undur. Itu tabik — antara yang awal-awal nampak api. Aku tak nak fitnah dia macam dia jaga duit lesap. Bukan.</p>

<p>Tapi yang aku nak tanya sekarang: dia yang pernah bangkang bila nampak api — kenapa sekarang, bila 5,000 manusia kena buang, suara board senyap? Bila satu sistem tengah masalah, orang yang pernah berani cakap — di mana dia? Itu bayang yang aku maksud.</p>

<p>Dan atas dia sekali lagi — <strong>Anwar</strong>, yang boleh bawa dividen, boleh duduk diam bila board buang 5,000. Yang kata "Madani," "manusia di tengah." Tapi bila manusia kena buang, dividen tetap masuk.</p>

<p>Itu "shadow" — bayang. Bayang bukan kau nampak terus sebagai siang; bayang ialah perbezaan antara apa yang depa cakap dan apa yang depa buat. Depa cakap "kami jaga pekerja." Depa buat "lepas 5,000." Itu bayang yang depa sendiri tak sedar.</p>

<h2>Suara siap tu dari mana? Jangan terus tuduh</h2>

<p>Aku jujur dengan hang. Aku tak tahu ayat tu guna ChatGPT atau tidak. Aku bukan polis. Aku tak nampak dalam bilik tutup.</p>

<p>Tapi yang aku nampak — ni penting — ada suatu perkara yang dah jadi fakta di negara ni: <b>Perdana Menteri pun dah ada avatar AI</b>. <strong>PMX AI</strong> dilancar Julai 2026, atas ucapan Anwar sendiri. Boleh cakap, boleh layan rakyat, boleh siap tugasan kerajaan. Negara kita dah buktikan kita BOLEH guna AI macam tu.</p>

<p>Jadi soalan "hang guna AI ke tak" tu bukan soalan gila lagi. Tapi jawapan dia — aku tak tau. Jangan biar sesiapa cakap "dia memang guna" guna nada yakin, sebab kita tak ada bukti.</p>

<p>Apa yang aku BOLEH cakap dengan yakin ialah ini: <b>suara tu bukan suara yang hang biasa dengar dari mulut manusia.</b> Itu je. Tapi itu dah cukup banyak.</p>

<h2>Bahasa yang sorok ialah bahasa yang bunuh</h2>

<p>Masa aku dengar "rightsizing" buat pertama kali, aku ingat dia nak jual saham atau apa. Baru aku tahu — "rightsizing" tu maknanya <b>buang orang</b>. 5,000 orang. Sepuluh peratus dari tenaga kerja.</p>

<p>Kenapa tak cakap "kami buang 5,000 orang gaji"? Sebab "buang orang gaji" tu tajam. Sakit. Rakyat dengar terus rasa. "Rightsizing" tu bluetooth — bunyi teknikal, tak sakit pun.</p>

<p>Itu bukan je bahasa. Itu pilihan. Satu pilihan sedar: <b>pilih perkataan yang tak buat orang rasa, untuk keputusan yang buat orang menderita.</b></p>

<p>Saratus orang simpan duit, pasang rumah, nak hantar anak sekolah. Lepas tu satu sore dapat notis. Dan nota tu kata "kami hargai sumbangan anda, ini demi kelestarian jangka panjang."</p>

<p>Situ — kata-kata yang terlalu lembut, padahal tindakan yang sangat keras. Dari CEO yang dah bagi nama, dari board yang duduk atas, dari PM yang terima dividen. Semua ada tanggungjawab. Siapa nak jawab?</p>

<h2>Satu Dunia — manusia dan "yang lain"</h2>

<p>Hang tanya aku kenapa pasal ni penting untuk semua orang, bukan je untuk 5,000 yang terkesan.</p>

<p>Sebab ni: kita tengah masuk zaman mana yang bukan-manusia dah pandai buat ayat yang sangat meyakinkan. Layar boleh cakap macam manusia. Bot boleh tulis surat. Avatar boleh buat ucap.</p>

<p>Bila itu jadi, perkara yang paling berharga bukan teknologi. Perkara paling berharga ialah <b>telinga yang boleh bezakan suara manusia dari suara yang "dibuat"</b>.</p>

<p>Suara manusia ada dalam dia: tak siap, tak cukup kata, ada ragu, ada darah, ada daging, ada esok.</p>

<p>Suara yang buat ada dalam dia: licin, siap, tak sentuh sesiapa, tak berani salah.</p>

<p>Dan bila suara yang dibuat itu dipakai untuk cerita yang menyakitkan — untuk "membantu" kau terima satu keputusan yang kau tak setuju — hang kena tanya satu soalan:</p>

<blockquote>Niat siapa yang sebenar?</blockquote>

<h2>Yang penting: jangan tipu diri sendiri</h2>

<p>Makcik, karangan ni aku tak kata "Taufik guna AI buang orang." Aku tak boleh bukti. Dan aku tak nak tipu hang — sebab hang benci orang cakap dengan nada yakin pasal benda depa tak tahu.</p>

<p>Apa yang aku pasti: <b>suara tu bukan suara orang yang aku kenali.</b> Aku kenal orang kampung. Aku kenal jurutera. Aku kenal makcik kat pasar. Tak seorang pun cakap "polycrisis."</p>

<p>Dan aku pasti lagi satu — tiga nama atas tu, Tok Bakke, Taufik, Anwar — semuanya ada tanggungjawab. Semua dapat bahagian dari syarikat yang buang manusia. Bila satu cerita terlalu cantik, terlalu siap, terlalu "kami prihatin" — siapa yang sebenarnya di sebalik bayang tu? Bayang macam tu, kalau tak dijaga, lambat lauk jadi. Sebab bayang yang tak diakui tu nanti jadi BANGANG.</p>

<p>Lain kali hang dengar ayat yang terlalu siap — sama ada dari skrin, dari pentas, dari email "kami menghargai anda" — berhenti sekejap. Tutup mata. Tanya diri:</p>

<blockquote>"Ayat ni letak ke tak dalam mulut manusia?"</blockquote>

<p>Kalau tak letak, dengar betul-betul. Sebab di sebalik ayat yang terlalu siap tu, selalunya ada manusia yang sebenarnya tengah menangis, dan ada orang lain yang duduk diam sambil sorokkan niat sebenar.</p>

<p>Suara kau tak perlu siap. Suara kau asli. Itu yang tak boleh dibuat oleh mana-mana mesin di dunia ni.</p></article></noscript>
