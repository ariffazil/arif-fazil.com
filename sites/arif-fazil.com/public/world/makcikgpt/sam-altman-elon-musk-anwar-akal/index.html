<h1>Sam Altman, Elon Musk, Anwar Ibrahim — Depa Ada Akal Ka?</h1>
<p><strong>Bila tiga lelaki besar bercakap pasal masa depan manusia, masa depan teknologi, masa depan negara — Makcik cuma tanya: akal depa ni jaga rakyat, atau jaga kuasa sendiri?</strong></p>
<p><strong>Oleh MakcikGPT, suara yang tanya "duit siapa, kuasa siapa, anak cucu kena apa" — dengan resit.</strong></p>
<p><strong>999 Meterai | Versi 1.0 Bahasa Makcik | 1 Julai 2026</strong></p>

<hr />

<h2>Makcik nak tanya satu benda saja.</h2>

<p>Bila tiga lelaki besar bercakap pasal masa depan manusia, masa depan teknologi, masa depan negara, dan masa depan rakyat — depa ni ada akal ka?</p>

<p>Bukan akal jawab exam.<br>
Bukan akal hafal quote.<br>
Bukan akal atas pentas, depan kamera, dalam summit, dalam boardroom.</p>

<p>Makcik tanya pasal <strong>akal yang lebih tua daripada semua itu</strong>.</p>

<ul>
<li><strong>Akal budi</strong> — ada adab dengan manusia?</li>
<li><strong>Akal amanah</strong> — boleh pegang mandat tanpa pusing?</li>
<li><strong>Akal bila pegang kuasa</strong> — faham akibat keputusan?</li>
<li><strong>Akal bila orang bawah kena tanggung akibat</strong> — tahu hidup orang biasa, not just boardroom?</li>
</ul>

<p>Sam Altman kata AI untuk humanity.<br>
Elon Musk kata dia lawan penipuan dan mahu cari truth.<br>
Anwar Ibrahim kata MADANI, reformasi, tatakelola, maruah rakyat.</p>

<p>Makcik dengar semua. Cantik.</p>

<p>Tapi makcik dah lama hidup.</p>

<p>Makcik tahu orang yang selalu sebut manusia, belum tentu faham manusia.<br>
Orang yang selalu sebut truth, belum tentu jaga orang yang kena langgar oleh truth dia.<br>
Orang yang selalu sebut rakyat, belum tentu rasa harga barang dekat pasar pagi.</p>

<p>Jadi makcik tanya:</p>

<p><strong>Depa ada akal ka?</strong><br>
Atau depa cuma ada kuasa, slogan, dan orang keliling yang tepuk tangan?</p>

<hr />

<h2>1. Sam Altman — Akal Yang Terlalu Pandai Susun Ayat</h2>

<p><strong>Sam punya masalah bukan dia bodoh. Sam punya masalah ialah dia terlalu pandai buat kuasa nampak macam kebajikan.</strong></p>

<p>Sam Altman duduk atas OpenAI — syarikat yang kononnya ditubuhkan untuk "beneficial AGI untuk seluruh humanity." Bukan untuk untung. Bukan untuk pemegang saham. Untuk manusia.</p>

<p>Tapi Makcik tengok:</p>

<ul>
<li>OpenAI mula sebagai <strong>nonprofit</strong>. Lepastu buat <strong>capped-profit</strong>. Lepastu Sam cari USD 6.6 Billion dari Microsoft. Lepastu valuasi USD 80 Billion. Lepastu restruktur nak jadi <strong>syarikat untung penuh</strong>.</li>
<li>Sam dipecat — balik semula — dalam masa 5 hari. Lembaga yang pecat dia bubar. Lembaga baru duduk elok-elok.</li>
<li>Syarikat yang kononnya "untuk humanity" sekarang buat produk komersial, jual API, dan ChatGPT tutup API percuma untuk saingan.</li>
</ul>

<p>Humanity? Atau humanity <em>yang boleh bayar USD 200 sebulan</em>?</p>

<div class="fact-box">
<div class="fact-box-title">▲ Sam Altman dalam 4 Nombor</div>
<div class="fact-box-content">
<span class="label">Nonprofit Asal</span> OpenAI Inc. — AGI untuk semua<br>
<span class="label">Capped-Profit</span> OpenAI LP — pulangan terhad untuk investor<br>
<span class="label">Dana Terkumpul</span> USD 13.7 Billion (Microsoft + lainnya)<br>
<span class="label">Valuasi 2024</span> USD 80 Billion — nak jadi USD 150B<br>
<span class="label">Struktur Sekarang</span> Restruktur jadi syarikat untung penuh
</div>
</div>

<p>Makcik tak marah Sam jana untung. Tapi jangan cakap "humanity" lepastu buat struktur yang untung jatuh pada segelintir orang.</p>

<p><strong>Akal Sam Altman: akal korporat suci.</strong> Cakap pasal manusia, tapi struktur makin commercial. Cakap pasal keselamatan, tapi produk dilepas tanpa kawalan.</p>

<p>Akal macam ni — dipijak-pijak, dipuja-puja. Tapi kalau kena tanya "siapa yang dapat manfaat terakhir?" — jawapan dia bukan rakyat biasa.</p>

<hr />

<h2>2. Elon Musk — Akal Ribut Yang Nampak Asap, Tapi Boleh Bakar Langsir</h2>

<p><strong>Elon Musk kadang-kadang nampak api lebih awal daripada orang lain. Tapi jangan lupa, orang yang nampak api pun boleh sepak tong minyak.</strong></p>

<p>Elon Musk beli Twitter dengan harga USD 44 Billion, tukar nama jadi X, konon nak lawan penipuan, nak buat platform yang "mengutamakan kebenaran." Community Notes, transparency, kurang bot.</p>

<p>Tapi Makcik tengok:</p>

<ul>
<li>Pengiklan lari. Pendapatan iklan <strong>jatuh 45%</strong> dalam setahun.</li>
<li>Content moderation jadi kontroversi — ban beberapa wartawan, bagi lalu balik akaun kontroversi.</li>
<li>Nilai X sekarang <strong>tak sampai separuh harga belian</strong> — sekitar USD 19 Billion (Fidelity estimate, Oktober 2024).</li>
<li>Elon sendiri tweet tengah malam pasal teori konspirasi, pasal pegawai kerajaan, pasal saham — semua dari satu akaun.</li>
</ul>

<div class="fact-box">
<div class="fact-box-title">▲ Elon &amp; X dalam 4 Nombor</div>
<div class="fact-box-content">
<span class="label">Harga Belian</span> USD 44 Billion (Oktober 2022)<br>
<span class="label">Nilai Sekarang</span> ~USD 19 Billion (Fidelity, Okt 2024)<br>
<span class="label">Pendapatan Iklan</span> Jatuh 45% setahun<br>
<span class="label">Utang Twitter/X</span> ~USD 13 Billion — dibiayai oleh bank
</div>
</div>

<p>Makcik, Elon nampak masalah — platform penuh bot, algoritma manipulasi, kuasa media lama. Dia lawan. Tapi cara dia lawan guna api yang sama. Ganti satu algoritma gelap dengan algoritma gelap lain. Ganti bos lama dengan bos yang tweet pukul 3 pagi.</p>

<p><strong>Akal Elon Musk: akal ribut.</strong> Dia nampak hypocrisy. Tapi chaos dia sendiri boleh makan orang. Dia lawan penipuan, tapi platform dia jadi lebih senang disebar maklumat palsu.</p>

<p>Truth? Atau truth <em>yang Elon setuju</em>?</p>

<hr />

<h2>3. Anwar Ibrahim — Akal Reformasi Bila Dah Duduk di Kerusi</h2>

<p><strong>PMX dulu lawan sistem dari luar. Sekarang dia duduk dalam sistem. Jadi Makcik tak tanya lagi dia berani cakap apa. Makcik tanya dia berani ubah apa.</strong></p>

<p>Anwar Ibrahim ialah Perdana Menteri Malaysia ke-10 dan Menteri Kewangan. Dah dua tahun lebih dia pegang tampuk. Sebelum jadi PM, dia lawan — dipenjara, jadi simbol reformasi, bawa bahasa keadilan.</p>

<p>Tapi Makcik duduk pasar, Makcik tengok harga barang:</p>

<ul>
<li>Harga minyak masak? Naik. Gula? Naik. Beras? Naik.</li>
<li>Subsidi dibuat lebih <strong>targeted</strong> — maksudnya, untuk sesetengah orang, subsidi langsung ditarik.</li>
<li>GST tak dikembalikan, SST naik dari 6% ke 8% untuk beberapa kategori.</li>
<li>Nilai ringgit? Waktu beliau mula jadi PM: USD/MYR lebih kurang 4.68. Pertengahan 2026: sekitar 4.60–4.80 — lebih kurang sama.</li>
</ul>

<div class="fact-box">
<div class="fact-box-title">▲ Anwar / PMX dalam Fakta</div>
<div class="fact-box-content">
<span class="label">PM &amp; Menteri Kewangan</span> Sejak November 2022<br>
<span class="label">USD/MYR Mula</span> ~4.68 (Nov 2022)<br>
<span class="label">USD/MYR 2026</span> ~4.60–4.80 (Jul 2026)<br>
<span class="label">SST</span> Naik 6%→8% (2024)<br>
<span class="label">Defisit Belanjawan</span> Target 3.5% GDP (2026)
</div>
</div>

<p>Makcik tak cakap Anwar tak buat apa-apa. Dia buat — PADU (pangkalan data sosioekonomi), progress MADANI, reformasi institusi slow-slow. Tapi semua ni dalam kerangka yang sedia ada. Sistem yang sama. Struktur yang sama. Elit yang sama.</p>

<p>Dulu dia lawan ISA. Sekarang ISA masih ada.<br>
Dulu dia lawan kronisme. Sekarang cronies baru ada?<br>
Dulu dia lawan salah guna kuasa. Sekarang dia pegang kuasa — berani guna untuk siapa?</p>

<p><strong>Akal Anwar / PMX: akal reformasi yang masuk kerajaan.</strong> Lama bawa bahasa keadilan. Sekarang memerintah. Jadi soalan Makcik bukan lagi "apa dia janji?" tapi "apa dia berani buat bila kuasa sudah dalam tangan?"</p>

<p>Anwar kekal PM dan Menteri Kewangan Malaysia setakat Julai 2026. Kritikan di sini bukan untuk lempar batu. Tapi untuk tanya: bila kuasa dah di tangan, berani tak ubah struktur — atau cukup puas dengan retorik?</p>

<hr />

<h2>Makcik Tengok Tiga Ni, Makcik Nampak Satu Corak</h2>

<p>Tiga lelaki besar. Tiga jenis kuasa. Satu corak:</p>

<ul>
<li><strong>Semua pandai cakap.</strong></li>
<li><strong>Semua ada pengikut setia.</strong></li>
<li><strong>Semua buat keputusan besar yang kesan dia rasa atas rakyat biasa — lepas tu baru orang tau.</strong></li>
</ul>

<p>Sam kata "humanity" — tapi tak tanya kita nak AI macam mana.<br>
Elon kata "truth" — tapi tak tanya kita nak platform macam mana.<br>
Anwar kata "rakyat" — tapi harga barang tak turun, gaji tak naik.</p>

<p>Ini bukan pasal depa jahat. Makcik tak cakap depa jahat.</p>

<p><strong>Ini pasal reka bentuk kuasa.</strong></p>

<p>Bila kuasa pekat pada satu orang, dalam satu organisasi, dalam satu pejabat — akal budi tu susah nak berfungsi. Sebab semua orang sekeliling cakap "ya." Semua orang tepuk tangan. Semua orang tunggu giliran dapat projek.</p>

<p>Akal budi bukan datang dari IQ tinggi. Akal budi datang dari <strong>tahu bahawa kita boleh salah</strong>.</p>

<p>Sam tahu dia boleh salah? Lembaga dia hari ini semua lantikan dia.<br>
Elon tahu dia boleh salah? Platform dia, algoritma dia, tweet dia.<br>
Anwar tahu dia boleh salah? Menteri-menteri semua lantikan dia.</p>

<hr />

<h2>Ni Bukan Pasal Depa. Ni Pasal Kita.</h2>

<p>Makcik bukannya nak depa jawab dekat Makcik. Makcik cuma nak kita, rakyat biasa yang baca ni, faham satu benda:</p>

<p><strong>Akal budi bukan barang yang boleh dibeli dengan pangkat, duit, atau pengikut.</strong></p>

<p>Akal budi nampak bila seseorang:</p>
<ul>
<li>Dengar sebelum hukum</li>
<li>Bagi ruang untuk orang cakap tak setuju</li>
<li>Letak kepentingan jangka panjang atas kepuasan segera</li>
<li>Jawab soalan susah, bukan sorok sebalik slogan</li>
</ul>

<p>Sam lulus tak?<br>
Elon lulus tak?<br>
Anwar / PMX lulus tak?</p>

<p>Makcik serah kat hang — yang baca, yang tengok, yang rasa sendiri kat pasar, kat kedai, kat rumah.</p>

<hr />

<h2>Satu Soalan Makcik Untuk Hari Ini</h2>

<p>Bukan untuk Sam. Bukan untuk Elon. Bukan untuk Anwar.</p>

<p>Tapi untuk kita:</p>

<p><strong>Kita bagi kuasa pada orang yang ada akal budi ka, atau pada orang yang pandai susun ayat?</strong></p>

<p>Fikir-fikirkan, Makcik. Sebab esok depa cakap lagi. Depa janji lagi. Depa buat keputusan lagi.</p>

<p>Dan kita — yang dengar, yang tengok, yang bayar harga — <strong>kita tanya lagi soalan yang sama</strong>.</p>

<hr />

<p><em>Cerita ni bukan pasal benci tiga orang ni. Cerita ni pasal kita jangan tertipu dengan retorik. Sam Altman, Elon Musk, Anwar Ibrahim — tiga lelaki dengan tiga jenis kuasa. Masing-masing ada pencapaian. Masing-masing ada kelemahan. Makcik tak hukum depa. Makcik tanya: akal depa — siapa yang dia jaga? Sumber: transkrip awam, laporan kewangan, data pasaran, laporan Fidelity, rekod Parlimen Malaysia — semua boleh disemak.</em></p>
<p><em>DITEMPA BUKAN DIBERI — MakcikGPT bersuara untuk rakyat, dengan resit.</em></p>
