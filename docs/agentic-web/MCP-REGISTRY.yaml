tier_B_local_reversible:
  description: Worktree and source code mutation; zero direct production infrastructure risk
  adapters:
    - filesystem write in /root/arif-fazil.com (worktree preferred)
    - git branch + commit (never bare push to main)
    - npm run prebuild (scripts/generate-nav-canon.cjs, compile-design-tokens.py, check-design-tokens.py, etc.)
    - npm run build (tsc -b && vite build)
    - serena code mutations: replace_symbol_body, insert_after_symbol, replace_content
    - python3 scripts/web-zen/web_zen.py orphan --src ... --dest /var/www/html/arif
    - rsync WITHOUT --delete to /var/www/html/arif after orphan preview confirms safety
    - static file copy (institution/, human/, earth/index.html, llms.txt, missions.json)
  forbidden:
    - rsync --delete without orphan.ok verification
    - hand-edit /var/www/html without source twin in /root/arif-fazil.com
    - npm install new dependencies without announcing

tier_C_external_write_human_bound:
  description: Requires explicit Chairman/F13 mission mandate or bounded lease
  adapters:
    - git push origin <branch> (T2-PUSH with bound lease announcement)
    - github.create_pull_request
    - make deploy (BLOCKED without explicit Caddy assent, as Makefile reload target triggers Caddy T3)
    - email/telegram external dispatch
  condition: exact commit SHA + exact diff + verification receipt shown first

tier_D_privileged:
  description: Sovereign Royal Assent required (T3 HOLD)
  adapters:
    - systemctl reload caddy / caddy reload
    - DNS, Cloudflare edge, firewall, secret rotation
    - public /a2a live mutations
    - core constitution or arifOS F1-F13 rule changes
    - production DB DROP or raw state delete
  status: 888_HOLD unless Arif / F13 explicitly names and assents to the action

