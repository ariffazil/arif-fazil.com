machine_surfaces:
  "/llms.txt":
    purpose: "Agent site overview — curated link index"
    max_age_days: 7
  "/surfaces.json":
    purpose: "Canonical surface catalog — machine readable"
    max_age_days: 1
  "/sitemap.xml":
    purpose: "Search engine sitemap"
    max_age_days: 7
  "/feed.xml":
    purpose: "RSS feed — MakcikGPT articles"
    max_age_days: 1
  "/machine/manifest.json":
    purpose: "Single agent entrypoint"
    max_age_days: 1

regression_checks:
  visual_diff:
    required: true
    tolerance_pct: 5
    baseline_dir: "visual-baseline/"
  navigation:
    required: true
    max_click_depth: 3
    fail_if_increased: true
  attention:
    required: true
    max_understand_time_s: 180
    fail_if_increased: true
